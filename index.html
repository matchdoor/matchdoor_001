<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SmartQC - Quality Inspection System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<style>
:root{
  --blue:#2563eb; --blue-dark:#1e40af; --green:#16a34a; --red:#dc2626;
  --amber:#d97706; --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0;
  --gray-400:#94a3b8; --gray-600:#475569; --gray-800:#1e293b; --gray-900:#0f172a;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Sarabun,Tahoma,sans-serif;background:var(--gray-100);color:var(--gray-900);}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--gray-50);padding-bottom:90px;position:relative;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.topbar{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.topbar .back{font-size:22px;background:none;border:none;color:#fff;padding:4px 8px;border-radius:8px;}
.topbar .back:active{background:rgba(255,255,255,.2);}
.topbar h1{font-size:17px;margin:0;flex:1;font-weight:700;}
.topbar .sub{font-size:12px;opacity:.85;margin-top:1px;}
.page{padding:16px;}
.card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card:active{transform:scale(.995);}
.proj-card{display:flex;justify-content:space-between;align-items:center;}
.proj-code{color:var(--blue);font-weight:700;font-size:14px;}
.proj-name{font-size:16px;font-weight:600;margin-top:2px;}
.chev{color:var(--gray-400);font-size:20px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:var(--radius);padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat .num{font-size:26px;font-weight:800;}
.stat .lbl{font-size:12px;color:var(--gray-600);margin-top:2px;}
.stat.pass .num{color:var(--green);}
.stat.fail .num{color:var(--red);}
.stat.pending .num{color:var(--amber);}
.stat.defect .num{color:var(--red);}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.action-btn{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px 10px;text-align:center;font-weight:700;font-size:14px;color:var(--blue-dark);}
.action-btn .ic{font-size:22px;display:block;margin-bottom:4px;}
.doc-card{margin-bottom:10px;}
.doc-code{font-family:monospace;font-size:12px;color:var(--blue);font-weight:700;}
.doc-name{font-size:15px;font-weight:600;margin-top:3px;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:6px;}
.badge.draft{background:#e2e8f0;color:#475569;}
.badge.in_progress{background:#fef3c7;color:#92400e;}
.badge.completed{background:#dcfce7;color:#166534;}
.progress-row{margin-top:8px;}
.progress-bar{background:var(--gray-200);border-radius:10px;height:8px;overflow:hidden;}
.progress-fill{background:var(--blue);height:100%;border-radius:10px;transition:width .3s;}
.progress-txt{font-size:12px;color:var(--gray-600);margin-top:4px;}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--gray-200);}
.item-row:last-child{border-bottom:none;}
.item-num{width:26px;height:26px;border-radius:50%;background:var(--gray-200);color:var(--gray-600);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.item-num.pass{background:var(--green);color:#fff;}
.item-num.fail{background:var(--red);color:#fff;}
.item-info{flex:1;padding:0 10px;}
.item-name{font-size:15px;font-weight:600;}
.item-score{font-size:12px;color:var(--gray-600);}
.section-title{font-size:14px;font-weight:700;color:var(--gray-600);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
.field-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100);}
.field-label{font-size:15px;font-weight:600;}
.pf-btns{display:flex;gap:6px;}
.pf-btn{padding:8px 14px;border-radius:10px;border:2px solid var(--gray-200);background:#fff;font-weight:700;font-size:13px;}
.pf-btn.pass.active{background:var(--green);border-color:var(--green);color:#fff;}
.pf-btn.fail.active{background:var(--red);border-color:var(--red);color:#fff;}
.stars{display:flex;gap:6px;font-size:32px;justify-content:center;padding:10px 0;}
.star{color:var(--gray-200);cursor:pointer;}
.star.filled{color:#f59e0b;}
textarea,input[type=text]{width:100%;border:1px solid var(--gray-200);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;resize:vertical;}
.photo-actions{display:flex;gap:8px;margin-top:10px;}
.photo-actions label,.photo-actions button{flex:1;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;text-align:center;}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--gray-200);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;}
.footer-nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--gray-200);display:flex;padding:10px 14px;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.nav-btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:700;font-size:15px;}
.nav-btn.secondary{background:var(--gray-200);color:var(--gray-800);}
.nav-btn.primary{background:var(--blue);color:#fff;}
.nav-btn:disabled{opacity:.4;}
.empty{text-align:center;padding:40px 20px;color:var(--gray-600);}
.empty .ic{font-size:40px;margin-bottom:10px;}
.fail-banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px;}
.hist-item{padding:12px 0;border-bottom:1px solid var(--gray-100);}
.hist-date{font-size:12px;color:var(--gray-600);}
.hist-doc{font-family:monospace;font-size:12px;color:var(--blue);margin-top:2px;}
.hist-action{font-size:14px;font-weight:600;margin-top:2px;}
.res-pass{color:var(--green);font-weight:700;}
.res-fail{color:var(--red);font-weight:700;}
.def-card .status{float:right;}
.status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.status-pill.open{background:#fee2e2;color:#991b1b;}
.status-pill.in_progress{background:#fef3c7;color:#92400e;}
.status-pill.fixed{background:#dbeafe;color:#1e40af;}
.status-pill.verified,.status-pill.closed{background:#dcfce7;color:#166534;}
.sig-pad-wrap{border:1px dashed var(--gray-400);border-radius:10px;background:#fff;}
canvas.sigpad{width:100%;height:150px;touch-action:none;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.spinner{width:34px;height:34px;border:3px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.pdf-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.pdf-btn-grid button{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:14px;}
.pdf-btn-grid button.alt{background:#fff;color:var(--blue);border:2px solid var(--blue);}
.field-group{margin-top:14px;}
.autosave-note{font-size:11px;color:var(--gray-400);text-align:center;margin-top:6px;}
.link-file{display:flex;align-items:center;gap:8px;background:var(--gray-100);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG — แก้ 2 ค่านี้ให้เป็นของโปรเจกต์ Supabase ของคุณ
// ============================================================
const SUPABASE_URL = "https://tisshukqkeejmmokvoss.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpc3NodWtxa2Vlam1tb2t2b3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzQ3MDgsImV4cCI6MjEwNjkxMDcwOH0.onYYx-c4MH8HOnDyIngEy-M43GTHQiQLGD4looHAv7U";
const BUCKET = "smartqc";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// TINY ROUTER + STATE
// ============================================================
const app = document.getElementById("app");

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nav(hash){ location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function parseHash(){
  const h = location.hash.slice(1) || "/";
  const parts = h.split("/").filter(Boolean);
  return parts;
}

async function render(){
  const parts = parseHash();
  window.scrollTo(0,0);
  try{
    if(parts.length===0) return renderHome();
    if(parts[0]==="project" && parts[2]==="documents") return renderDocuments(parts[1]);
    if(parts[0]==="project" && parts[2]==="defects") return renderProjectDefects(parts[1]);
    if(parts[0]==="project" && parts[2]==="history") return renderHistory(parts[1]);
    if(parts[0]==="project") return renderDashboard(parts[1]);
    if(parts[0]==="document" && parts[2]==="item") return renderInspectionItem(parts[1], parts[3]);
    if(parts[0]==="document" && parts[2]==="pdf") return renderPdfScreen(parts[1]);
    if(parts[0]==="document" && parts[2]==="files") return renderDocFiles(parts[1]);
    if(parts[0]==="document") return renderDocumentDetail(parts[1]);
    if(parts[0]==="defect") return renderDefectDetail(parts[1]);
    return renderHome();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="page"><div class="empty"><div class="ic">⚠️</div><b>เกิดข้อผิดพลาด</b><br><span style="font-size:12px">${esc(err.message||err)}</span></div></div>`;
  }
}

function topbar(title, sub, backHash){
  return `<div class="topbar">
    ${backHash?`<button class="back" onclick="nav('${backHash}')">‹</button>`:''}
    <div><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>
  </div>`;
}

// ============================================================
// HOME — Project list
// ============================================================
async function renderHome(){
  app.innerHTML = topbar("SmartQC","Quality Inspection System") + `<div class="page" id="list"><div class="spinner"></div></div>`;
  const { data, error } = await sb.from("projects").select("*").order("created_at");
  if(error) throw error;
  const el = document.getElementById("list");
  if(!data.length){ el.innerHTML = `<div class="empty"><div class="ic">📁</div>ยังไม่มีโครงการ</div>`; return; }
  el.innerHTML = data.map(p=>`
    <a class="card proj-card" href="#/project/${p.id}">
      <div><div class="proj-code">${esc(p.code)}</div><div class="proj-name">${esc(p.name)}</div></div>
      <div class="chev">›</div>
    </a>`).join("");
}

// ============================================================
// PROJECT DASHBOARD
// ============================================================
async function renderDashboard(projectId){
  app.innerHTML = topbar("โครงการ","",'/') + `<div class="page" id="dash"><div class="spinner"></div></div>`;
  const { data: proj } = await sb.from("projects").select("*").eq("id", projectId).single();
  const { data: docs } = await sb.from("documents").select("id,status").eq("project_id", projectId);
  const { data: prog } = await sb.from("v_document_progress").select("*").eq("project_id", projectId);
  const { data: defects } = await sb.from("defects").select("id,status,document_id").in("document_id", (docs||[]).map(d=>d.id).length?(docs||[]).map(d=>d.id):['00000000-0000-0000-0000-000000000000']);

  const totalItems = (prog||[]).reduce((s,p)=>s+Number(p.total_items||0),0);
  const checked = (prog||[]).reduce((s,p)=>s+Number(p.checked_items||0),0);
  const pass = (prog||[]).reduce((s,p)=>s+Number(p.pass_items||0),0);
  const fail = (prog||[]).reduce((s,p)=>s+Number(p.fail_items||0),0);
  const pending = totalItems - checked;
  const openDefects = (defects||[]).filter(d=>!['closed','verified'].includes(d.status)).length;

  app.querySelector(".topbar > div").innerHTML = `<h1>${esc(proj.name)}</h1><div class="sub">${esc(proj.code)}</div>`;

  document.getElementById("dash").innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${totalItems}</div><div class="lbl">ตรวจทั้งหมด</div></div>
      <div class="stat pass"><div class="num">${pass}</div><div class="lbl">ผ่าน</div></div>
      <div class="stat fail"><div class="num">${fail}</div><div class="lbl">ไม่ผ่าน</div></div>
      <div class="stat pending"><div class="num">${pending}</div><div class="lbl">รอตรวจ</div></div>
    </div>
    <div class="stat defect" style="margin-bottom:14px;"><div class="num">${openDefects}</div><div class="lbl">Defect ค้าง</div></div>
    <div class="actions-grid">
      <a class="action-btn" href="#/project/${projectId}/documents"><span class="ic">📋</span>เอกสารตรวจสอบ</a>
      <a class="action-btn" href="#/project/${projectId}/defects"><span class="ic">🛠️</span>Defect</a>
      <a class="action-btn" href="#/project/${projectId}/history"><span class="ic">🕒</span>ประวัติ</a>
      <a class="action-btn" href="#/project/${projectId}/documents"><span class="ic">📄</span>สร้าง PDF</a>
    </div>`;
}

// ============================================================
// DOCUMENT LIST
// ============================================================
async function renderDocuments(projectId){
  app.innerHTML = topbar("เอกสารตรวจสอบ","",`#/project/${projectId}`) + `<div class="page" id="list"><div class="spinner"></div></div>`;
  const { data: proj } = await sb.from("projects").select("*").eq("id", projectId).single();
  app.querySelector(".topbar > div").innerHTML = `<h1>เอกสารตรวจสอบ</h1><div class="sub">${esc(proj.code)}</div>`;

  const { data: docs, error } = await sb.from("documents")
    .select("id,document_code,status,template_id,checklist_templates(name)")
    .eq("project_id", projectId).order("document_code");
  if(error) throw error;
  const { data: prog } = await sb.from("v_document_progress").select("*").eq("project_id", projectId);
  const progMap = {}; (prog||[]).forEach(p=>progMap[p.document_id]=p);

  const el = document.getElementById("list");
  if(!docs.length){ el.innerHTML = `<div class="empty"><div class="ic">📄</div>ยังไม่มีเอกสาร</div>`; return; }
  el.innerHTML = docs.map(d=>{
    const p = progMap[d.id] || {total_items:0,checked_items:0};
    const pct = p.total_items ? Math.round((p.checked_items/p.total_items)*100) : 0;
    return `<a class="card doc-card" href="#/document/${d.id}">
      <div class="doc-code">${esc(d.document_code)}</div>
      <div class="doc-name">${esc(d.checklist_templates?.name || '')}</div>
      <span class="badge ${d.status}">${statusTh(d.status)}</span>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-txt">ตรวจแล้ว ${p.checked_items||0} / ${p.total_items||0} (${pct}%)</div>
      </div>
    </a>`;
  }).join("");
}
function statusTh(s){ return {draft:"ร่าง",in_progress:"กำลังตรวจ",completed:"เสร็จสิ้น"}[s] || s; }

// ============================================================
// DOCUMENT DETAIL — item checklist
// ============================================================
async function renderDocumentDetail(documentId){
  app.innerHTML = topbar("รายละเอียดเอกสาร","",'#/') + `<div class="page" id="body"><div class="spinner"></div></div>`;
  const { data: doc } = await sb.from("documents")
    .select("*, checklist_templates(name,code), projects(id,code,name)").eq("id", documentId).single();
  if(!doc) throw new Error("ไม่พบเอกสาร");
  app.querySelector(".back").setAttribute("onclick", `nav('#/project/${doc.projects.id}/documents')`);
  app.querySelector(".topbar > div").innerHTML = `<h1>${esc(doc.document_code)}</h1><div class="sub">${esc(doc.projects.code)}</div>`;

  const { data: items } = await sb.from("checklist_template_items").select("*").eq("template_id", doc.template_id).order("sort_order");
  // latest inspection for this doc (create if none)
  let { data: insp } = await sb.from("inspections").select("*").eq("document_id", documentId).order("created_at",{ascending:false}).limit(1);
  let inspection = insp && insp[0];
  if(!inspection){
    const { data: newInsp, error } = await sb.from("inspections").insert({document_id: documentId}).select().single();
    if(error) throw error;
    inspection = newInsp;
  }
  const { data: results } = await sb.from("inspection_results").select("*").eq("inspection_id", inspection.id);
  const resMap = {}; (results||[]).forEach(r=>resMap[r.template_item_id]=r);
  const checkedCount = Object.values(resMap).filter(r=>r.status==='pass'||r.status==='fail').length;
  const pct = items.length ? Math.round((checkedCount/items.length)*100) : 0;

  document.getElementById("body").innerHTML = `
    <div class="card">
      <div style="font-weight:700;font-size:15px">${esc(doc.checklist_templates.name)}</div>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-txt">ตรวจแล้ว ${checkedCount} / ${items.length} (${pct}%)</div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <a class="action-btn" style="flex:1" href="#/document/${documentId}/files"><span class="ic">📎</span>เอกสารต้นฉบับ</a>
        <a class="action-btn" style="flex:1" href="#/document/${documentId}/pdf"><span class="ic">🖨️</span>สร้าง PDF</a>
      </div>
    </div>
    <div class="section-title">รายการตรวจสอบ</div>
    <div class="card" style="padding:6px 12px;">
      ${items.map((it,idx)=>{
        const r = resMap[it.id];
        const st = r ? r.status : 'pending';
        return `<div class="item-row" onclick="nav('#/document/${documentId}/item/${it.id}')">
          <div class="item-num ${st}">${idx+1}</div>
          <div class="item-info">
            <div class="item-name">${esc(it.name)}</div>
            <div class="item-score">${r && r.score!=null ? '★'.repeat(r.score)+'☆'.repeat(5-r.score)+' · '+(st==='pass'?'ผ่าน':st==='fail'?'ไม่ผ่าน':'') : 'ยังไม่ตรวจ'}</div>
          </div>
          <div class="chev">›</div>
        </div>`;
      }).join("")}
    </div>`;
}

// ============================================================
// DOCUMENT ORIGINAL FILES
// ============================================================
async function renderDocFiles(documentId){
  app.innerHTML = topbar("เอกสารต้นฉบับ","",`#/document/${documentId}`) + `<div class="page" id="body"><div class="spinner"></div></div>`;
  const { data: files } = await sb.from("document_files").select("*").eq("document_id", documentId).order("uploaded_at",{ascending:false});
  const body = document.getElementById("body");
  body.innerHTML = `
    <div class="card">
      <label style="display:block;background:var(--blue);color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:700;">
        + อัปโหลดไฟล์ (PDF/รูป)
        <input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">
      </label>
    </div>
    <div id="fileList">
      ${(files||[]).map(f=>`<div class="link-file"><span>📄</span><span style="flex:1">${esc(f.file_name||'ไฟล์')}</span><a href="${publicUrl(f.storage_path)}" target="_blank">เปิด</a></div>`).join("") || '<div class="empty">ยังไม่มีไฟล์</div>'}
    </div>`;
  document.getElementById("fileInput").addEventListener("change", async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast("กำลังอัปโหลด...");
    const path = `docfiles/${documentId}/${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file);
    if(error){ toast("อัปโหลดไม่สำเร็จ"); return; }
    await sb.from("document_files").insert({document_id: documentId, storage_path: path, file_name: file.name});
    toast("อัปโหลดสำเร็จ");
    renderDocFiles(documentId);
  });
}
function publicUrl(path){ return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

// ============================================================
// INSPECTION ITEM SCREEN
// ============================================================
async function renderInspectionItem(documentId, itemId){
  app.innerHTML = topbar("กำลังโหลด...","",`#/document/${documentId}`) + `<div class="page" id="body"><div class="spinner"></div></div>`;

  const { data: doc } = await sb.from("documents").select("*, projects(code), checklist_templates(name,code)").eq("id", documentId).single();
  const { data: items } = await sb.from("checklist_template_items").select("*").eq("template_id", doc.template_id).order("sort_order");
  const idx = items.findIndex(i=>i.id===itemId);
  const item = items[idx];
  if(!item) throw new Error("ไม่พบรายการตรวจ");
  const { data: fields } = await sb.from("checklist_template_fields").select("*").eq("template_item_id", itemId).order("sort_order");

  let { data: insp } = await sb.from("inspections").select("*").eq("document_id", documentId).order("created_at",{ascending:false}).limit(1);
  const inspection = insp[0];

  let { data: result } = await sb.from("inspection_results").select("*").eq("inspection_id", inspection.id).eq("template_item_id", itemId).maybeSingle();
  if(!result){
    const { data: newRes, error } = await sb.from("inspection_results").insert({inspection_id: inspection.id, template_item_id: itemId, status:'pending'}).select().single();
    if(error) throw error;
    result = newRes;
  }
  const { data: fieldResults } = await sb.from("checklist_results").select("*").eq("inspection_result_id", result.id);
  const fieldMap = {}; (fieldResults||[]).forEach(f=>fieldMap[f.template_field_id]=f.passed);

  const { data: photos } = await sb.from("photos").select("*").eq("inspection_result_id", result.id).eq("kind","inspection");

  app.querySelector(".topbar > div").innerHTML = `<h1>${esc(doc.checklist_templates.code)}</h1><div class="sub">${esc(doc.projects.code)}</div>`;
  app.querySelector(".back").setAttribute("onclick", `nav('#/document/${documentId}')`);

  let score = result.score || 0;
  let note = result.note || "";
  let localFieldState = {...fieldMap};
  let localPhotos = photos || [];

  const body = document.getElementById("body");
  function renderBody(){
    body.innerHTML = `
      <div class="card">
        <div style="font-weight:700;font-size:12px;color:var(--gray-600)">${esc(doc.checklist_templates.name)}</div>
        <div style="font-size:14px;color:var(--gray-600);margin-top:6px;">รายการ ${idx+1} / ${items.length}</div>
        <div class="progress-bar" style="margin-top:6px;"><div class="progress-fill" style="width:${Math.round(((idx+1)/items.length)*100)}%"></div></div>
        <div style="font-size:20px;font-weight:800;margin-top:12px;">${esc(item.name)}</div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Checklist</div>
        ${fields.map(f=>`
          <div class="field-row">
            <div class="field-label">${esc(f.label)}</div>
            <div class="pf-btns">
              <button class="pf-btn pass ${localFieldState[f.id]===true?'active':''}" onclick="window.__setField('${f.id}',true)">ผ่าน</button>
              <button class="pf-btn fail ${localFieldState[f.id]===false?'active':''}" onclick="window.__setField('${f.id}',false)">ไม่ผ่าน</button>
            </div>
          </div>`).join("")}
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">คะแนน</div>
        <div class="stars" id="starsRow">
          ${[1,2,3,4,5].map(n=>`<span class="star ${n<=score?'filled':''}" data-n="${n}" onclick="window.__setScore(${n})">★</span>`).join("")}
        </div>
        ${score>0 && score<3 ? `<div class="fail-banner">⚠️ คะแนนต่ำกว่า 3 ระบบจะสร้าง Defect อัตโนมัติเมื่อบันทึก</div>` : ''}
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">หมายเหตุ</div>
        <textarea id="noteBox" rows="3" placeholder="เขียนรายละเอียดเพิ่มเติม...">${esc(note)}</textarea>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">รูปภาพ</div>
        <div class="photo-actions">
          <label>📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" id="camInput" style="display:none"></label>
          <label>🖼️ เพิ่มรูป<input type="file" accept="image/*" multiple id="galInput" style="display:none"></label>
        </div>
        <div class="photo-grid" id="photoGrid">
          ${localPhotos.map(p=>`<div class="photo-thumb"><img src="${publicUrl(p.storage_path)}"><button class="rm" onclick="window.__removePhoto('${p.id}')">✕</button></div>`).join("")}
        </div>
      </div>
      <div class="autosave-note">บันทึกอัตโนมัติเมื่อกดถัดไป/ก่อนหน้า</div>
    `;
    document.getElementById("noteBox").addEventListener("input", e=> note = e.target.value);
    document.getElementById("camInput").addEventListener("change", e=>uploadPhotos(e.target.files));
    document.getElementById("galInput").addEventListener("change", e=>uploadPhotos(e.target.files));
  }

  window.__setField = (fieldId, val)=>{ localFieldState[fieldId]=val; renderBody(); };
  window.__setScore = (n)=>{ score = n; renderBody(); };
  window.__removePhoto = async (photoId)=>{
    const p = localPhotos.find(x=>x.id===photoId);
    if(p) await sb.storage.from(BUCKET).remove([p.storage_path]);
    await sb.from("photos").delete().eq("id", photoId);
    localPhotos = localPhotos.filter(x=>x.id!==photoId);
    renderBody();
  };

  async function compressImage(file){
    return new Promise((resolve)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => img.src = e.target.result;
      img.onload = () => {
        const maxDim = 1600;
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          const ratio = Math.min(maxDim/width, maxDim/height);
          width = Math.round(width*ratio); height = Math.round(height*ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        canvas.toBlob(blob=>resolve(blob), "image/jpeg", 0.8);
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhotos(fileList){
    toast("กำลังอัปโหลดรูป...");
    for(const file of fileList){
      const blob = await compressImage(file);
      const path = `inspection/${result.id}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg'});
      if(error){ toast("อัปโหลดไม่สำเร็จ"); continue; }
      const { data: newPhoto } = await sb.from("photos").insert({inspection_result_id: result.id, storage_path: path, kind:'inspection'}).select().single();
      localPhotos.push(newPhoto);
    }
    toast("อัปโหลดสำเร็จ");
    renderBody();
  }

  renderBody();

  // footer nav
  const footer = document.createElement("div");
  footer.className = "footer-nav";
  footer.innerHTML = `
    <button class="nav-btn secondary" id="prevBtn" ${idx===0?'disabled':''}>← ก่อนหน้า</button>
    <button class="nav-btn primary" id="nextBtn">${idx===items.length-1?'บันทึก & เสร็จสิ้น':'บันทึก & ถัดไป →'}</button>
  `;
  app.appendChild(footer);

  async function saveResult(){
    const anyFieldFail = Object.values(localFieldState).some(v=>v===false);
    const anyFieldSet = Object.keys(localFieldState).length>0;
    let status = 'pending';
    if(score>0) status = score>=3 ? 'pass' : 'fail';
    else if(anyFieldSet) status = anyFieldFail ? 'fail' : (Object.keys(localFieldState).length===fields.length ? 'pass' : 'pending');

    await sb.from("inspection_results").update({score: score||null, status, note, updated_at: new Date().toISOString()}).eq("id", result.id);

    for(const f of fields){
      if(f.id in localFieldState){
        await sb.from("checklist_results").upsert({inspection_result_id: result.id, template_field_id: f.id, passed: localFieldState[f.id]}, {onConflict:'inspection_result_id,template_field_id'});
      }
    }

    // log activity
    await sb.from("activity_logs").insert({
      project_id: doc.project_id, document_id: documentId, item_name: item.name,
      action: 'ตรวจสอบ', result: status==='pass'?'PASS':status==='fail'?'FAIL':null
    });

    // auto defect on fail
    if(status==='fail'){
      const { data: existingDefect } = await sb.from("defects").select("id").eq("inspection_result_id", result.id).eq("status","open").maybeSingle();
      if(!existingDefect){
        const { count } = await sb.from("defects").select("*",{count:'exact',head:true});
        const defectNo = 'DEF-' + String((count||0)+1).padStart(4,'0');
        const { data: defect } = await sb.from("defects").insert({
          defect_no: defectNo, inspection_result_id: result.id, document_id: documentId,
          description: `${item.name} - คะแนน ${score||0}/5`, score_at_fail: score||0, status:'open'
        }).select().single();
        // link current photos as "before" defect evidence too
        for(const p of localPhotos){
          await sb.from("photos").update({defect_id: defect.id}).eq("id", p.id);
        }
        toast(`สร้าง Defect ${defectNo} อัตโนมัติ`);
      }
    } else if(status==='pass'){
      // auto-verify open defects tied to this result on pass (re-inspection success)
      await sb.from("defects").update({status:'verified'}).eq("inspection_result_id", result.id).in("status",['open','in_progress','fixed']);
    }
  }

  document.getElementById("nextBtn").addEventListener("click", async ()=>{
    document.getElementById("nextBtn").textContent = "กำลังบันทึก...";
    await saveResult();
    if(idx < items.length-1){
      nav(`#/document/${documentId}/item/${items[idx+1].id}`);
    } else {
      // check if all items done
      const { data: allResults } = await sb.from("inspection_results").select("status").eq("inspection_id", inspection.id);
      const allDone = allResults.length===items.length && allResults.every(r=>r.status==='pass'||r.status==='fail');
      if(allDone){
        await sb.from("inspections").update({status:'completed'}).eq("id", inspection.id);
        await sb.from("documents").update({status:'completed'}).eq("id", documentId);
      } else {
        await sb.from("documents").update({status:'in_progress'}).eq("id", documentId);
      }
      toast("บันทึกครบทุกรายการแล้ว");
      nav(`#/document/${documentId}`);
    }
  });
  if(idx>0) document.getElementById("prevBtn").addEventListener("click", async ()=>{
    await saveResult();
    nav(`#/document/${documentId}/item/${items[idx-1].id}`);
  });
}

      <input type="text" id="approverName" placeholder="ชื่อผู้อนุมัติ" style="margin-top:8px;">
    </div>
    <div class="pdf-btn-grid">
      <button id="genBtn">📄 สร้าง PDF</button>

    <div id="pdfResult"></div>
  `;

  function setupPad(id){
    const canvas = document.getElementById(id);
    const ratio = Math.max(window.devicePixelRatio||1,1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    canvas.getContext("2d").scale(ratio,ratio);
    return new SignaturePad(canvas, {backgroundColor:'rgb(255,255,255)'});
  }
  const pad1 = setupPad("sig1");
  const pad2 = setupPad("sig2");
  window.__clearSig = (n)=> (n===1?pad1:pad2).clear();

  document.getElementById("genBtn").addEventListener("click", async ()=>{

    document.getElementById("genBtn").textContent = "📄 สร้าง PDF";
  });
}

async function generatePdf(documentId, doc, pad1, pad2, inspectorName, approverName){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'pt', format:'a4'});
  const pageW = pdf.internal.pageSize.getWidth();
  let y = 40;
  const marginX = 40;

  pdf.setFontSize(18); pdf.text("SmartQC - Inspection Report", marginX, y); y+=24;
  pdf.setFontSize(11);
  pdf.text(`Project: ${doc.projects.code}  ${doc.projects.name}`, marginX, y); y+=16;
  pdf.text(`Document: ${doc.document_code}`, marginX, y); y+=16;
  pdf.text(`Title: ${doc.checklist_templates.name}`, marginX, y); y+=16;
  pdf.text(`Date: ${new Date().toLocaleDateString('en-GB')}`, marginX, y); y+=24;

  const { data: items } = await sb.from("checklist_template_items").select("*").eq("template_id", doc.template_id).order("sort_order");
  const { data: insp } = await sb.from("inspections").select("*").eq("document_id", documentId).order("created_at",{ascending:false}).limit(1);
  const inspection = insp[0];
  const { data: results } = await sb.from("inspection_results").select("*").eq("inspection_id", inspection.id);
  const resMap = {}; (results||[]).forEach(r=>resMap[r.template_item_id]=r);

  pdf.setFontSize(13); pdf.text("Checklist Results", marginX, y); y+=18;
  pdf.setFontSize(10);
  for(const it of items){
    const r = resMap[it.id];
    if(y > 760){ pdf.addPage(); y=40; }
    const statusTxt = r ? (r.status==='pass'?'PASS':r.status==='fail'?'FAIL':'-') : '-';
    pdf.text(`${it.name}  |  Score: ${r&&r.score!=null?r.score:'-'}/5  |  ${statusTxt}`, marginX, y);
    y += 14;
    if(r && r.note){ pdf.setTextColor(90); pdf.text(`Note: ${r.note}`, marginX+10, y); y+=14; pdf.setTextColor(0); }
  }
  y += 10;

  // photos
  for(const it of items){
    const r = resMap[it.id];
    if(!r) continue;
    const { data: photos } = await sb.from("photos").select("*").eq("inspection_result_id", r.id).eq("kind","inspection");
    if(!photos || !photos.length) continue;
    if(y > 700){ pdf.addPage(); y=40; }
    pdf.setFontSize(11); pdf.text(`Photos: ${it.name}`, marginX, y); y+=10;
    let x = marginX;
    const imgSize = 110;
    for(const p of photos){
      try{
        const dataUrl = await imgToDataUrl(publicUrl(p.storage_path));
        if(x + imgSize > pageW - marginX){ x = marginX; y += imgSize + 10; }
        if(y + imgSize > 780){ pdf.addPage(); y=40; x=marginX; }
        pdf.addImage(dataUrl, 'JPEG', x, y, imgSize, imgSize);
        x += imgSize + 10;
      }catch(e){ console.warn("img fail", e); }
    }
    y += imgSize + 20;
  }

  // defects
  const { data: defects } = await sb.from("defects").select("*, inspection_results(template_item_id, checklist_template_items(name))").eq("document_id", documentId);
  if(defects && defects.length){
    if(y > 700){ pdf.addPage(); y=40; }
    pdf.setFontSize(13); pdf.text("Defects", marginX, y); y+=18; pdf.setFontSize(10);
    for(const d of defects){
      if(y > 760){ pdf.addPage(); y=40; }
      pdf.text(`${d.defect_no} - ${d.inspection_results?.checklist_template_items?.name||''} - Status: ${d.status}`, marginX, y); y+=14;
      if(d.description){ pdf.text(`  ${d.description}`, marginX, y); y+=14; }
    }
  }

  // signatures
  if(y > 650){ pdf.addPage(); y=40; }
  y += 20;
  pdf.setFontSize(13); pdf.text("Signatures", marginX, y); y+=20;
  const sigW = 200, sigH = 70;
  if(!pad1.isEmpty()){ pdf.addImage(pad1.toDataURL(), 'PNG', marginX, y, sigW, sigH); }
  if(!pad2.isEmpty()){ pdf.addImage(pad2.toDataURL(), 'PNG', marginX + 250, y, sigW, sigH); }
  y += sigH + 12;
  pdf.setFontSize(10);
  pdf.text(`Inspector: ${inspectorName||'____________________'}`, marginX, y);
  pdf.text(`Approver: ${approverName||'____________________'}`, marginX+250, y);

  // save signature images to storage + inspection record
  try{
    if(!pad1.isEmpty()){
      const blob1 = await (await fetch(pad1.toDataURL())).blob();
      const path1 = `signatures/${inspection.id}_inspector_${Date.now()}.png`;
      await sb.storage.from(BUCKET).upload(path1, blob1, {contentType:'image/png'});
      await sb.from("signatures").insert({inspection_id: inspection.id, role:'inspector', storage_path: path1});
    }
    if(!pad2.isEmpty()){
      const blob2 = await (await fetch(pad2.toDataURL())).blob();
      const path2 = `signatures/${inspection.id}_approver_${Date.now()}.png`;
      await sb.storage.from(BUCKET).upload(path2, blob2, {contentType:'image/png'});
      await sb.from("signatures").insert({inspection_id: inspection.id, role:'approver', storage_path: path2});
    }
    await sb.from("inspections").update({inspector_name: inspectorName, approver_name: approverName}).eq("id", inspection.id);
  }catch(e){ console.warn("sig save fail", e); }

  const fileName = doc.document_code.replace(/\//g,'-') + '.pdf';
  const blob = pdf.output('blob');
  const blobUrl = URL.createObjectURL(blob);

  document.getElementById("pdfResult").innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">✅ สร้าง PDF สำเร็จ</div>
      <div class="pdf-btn-grid">
        <button onclick="window.open('${blobUrl}','_blank')">👁️ เปิด PDF</button>
        <button class="alt" id="dlBtn">⬇️ ดาวน์โหลด</button>
        <button class="alt" onclick="window.print()">🖨️ Print</button>
        <button class="alt" id="shareBtn">📤 Share</button>
      </div>
    </div>`;
  document.getElementById("dlBtn").addEventListener("click", ()=>{
    const a = document.createElement('a'); a.href = blobUrl; a.download = fileName; a.click();
  });
  document.getElementById("shareBtn").addEventListener("click", async ()=>{
    if(navigator.share && navigator.canShare){
      const file = new File([blob], fileName, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title: fileName}); return; }catch(e){}
      }
    }
    const a = document.createElement('a'); a.href = blobUrl; a.download = fileName; a.click();
    toast("อุปกรณ์นี้ไม่รองรับ Share — ดาวน์โหลดแทน");
  });
  toast("สร้าง PDF สำเร็จ");
}

function imgToDataUrl(url){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      const canvas = document.createElement("canvas");
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext("2d").drawImage(img,0,0);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = url;
  });
}
</script>
</body>
