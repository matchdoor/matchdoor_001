<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMART QC · ระบบตรวจสอบงานติดตั้ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--p:#0b7a3e;--p2:#e8f5ee;--r:14px}
[data-theme=dark]{--bg:#0b1220;--c:#131c2e;--t:#e5edf7;--m:#94a3b8;--b:#25314a;--p:#34d17c;--p2:#12301f}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--t)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--c);border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:8px;align-items:center;padding:4px 10px 16px;font-size:18px}.brand img{width:34px}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:var(--t);text-decoration:none;margin-bottom:2px}
nav a.on{background:var(--p2);color:var(--p);font-weight:700}
main{padding:18px;max-width:1080px;width:100%;margin:auto;padding-bottom:96px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.bell{position:relative;text-decoration:none;font-size:22px}.bell i{position:absolute;top:-4px;right:-8px;background:#dc2626;color:#fff;font:700 11px/1 Sarabun;padding:3px 5px;border-radius:9px}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:16px}.m{color:var(--m);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--t)}.kpi b{display:block;font-size:26px}
.pill{color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar>span:first-child{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar>div{flex:1;background:var(--b);border-radius:6px;height:14px;display:flex;overflow:hidden}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:3px 0 8px}
label{font-size:13px;color:var(--m)}
.b{border:1px solid var(--b);background:var(--c);color:var(--t);padding:10px 14px;border-radius:10px;font:600 14px Sarabun;cursor:pointer}.b.p{background:var(--p);color:#fff;border-color:var(--p)}.b.d{background:#dc2626;color:#fff;border-color:#dc2626}.b.on{background:var(--p2);border-color:var(--p);color:var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--b)}.steps i.on{background:var(--p)}
.fc{display:block;width:100%;text-align:left;margin-bottom:8px}.fc small{color:var(--m);font-weight:400}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ph img,.add{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--b)}.add{background:var(--p2);color:var(--p);font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ck{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--b)}.ck>div{display:flex;gap:6px}
.pf{padding:8px 12px;border-radius:9px;border:1px solid var(--b);background:var(--c);color:var(--t);font:600 13px Sarabun}.pf.ok{background:#16a34a;color:#fff}.pf.no{background:#dc2626;color:#fff}
.fl{display:flex;gap:6px}.fl select{width:100px}
.pad{width:100%;height:140px;border:2px dashed var(--m);border-radius:12px;background:#fff;touch-action:none}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.mb{background:var(--c);border-radius:var(--r);padding:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:99}
.li{display:block;text-decoration:none;color:var(--t)}.li .m{display:flex;gap:8px;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs .b{white-space:nowrap}
.warn{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:10px;margin-bottom:12px}
.entry{max-width:440px;margin:6vh auto;padding:16px}.entry img{width:84px;display:block;margin:auto}
.pg{background:#fff;color:#111;font:12px/1.35 Sarabun,sans-serif;padding:26px 34px;position:relative;overflow:hidden}
.pg .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0b7a3e;padding-bottom:8px;margin-bottom:8px}.pg .hd img{width:58px}.pg .hd div{flex:1;text-align:center}.pg .hd b{font-size:17px;display:block}
.pg .bx{border:1px solid #333;padding:4px 10px;font-size:11px}.pg table{width:100%;border-collapse:collapse;table-layout:fixed;margin:8px 0}
.pg th,.pg td{border:1px solid #333;padding:3px 4px;text-align:center;font-size:10.5px;word-break:break-word}.pg th{background:#e8f5ee}.pg td.l{text-align:left}.pg td{height:40px}.pg td.x{color:#c00;font-weight:700}
.pg .sgs{display:flex;gap:14px;margin-top:10px}.pg .sg{flex:1;border:1px solid #333;text-align:center;padding:6px;font-size:11px}.pg .si{height:58px}.pg .si img{max-height:56px;max-width:100%}
.pg .ft{position:absolute;left:34px;right:34px;bottom:14px;display:flex;justify-content:space-between;font-size:10px;color:#444}
.pg .eg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pg .eg h4{margin:0 0 4px;font-size:12px;background:#e8f5ee;padding:3px 6px}.pg .im{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pg .im div{border:1px solid #bbb;display:flex;align-items:center;justify-content:center;background:#fafafa}.pg .im img{max-width:100%;max-height:100%;object-fit:contain}
@media(max-width:800px){.app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;display:flex;padding:4px;z-index:20;border-top:1px solid var(--b);border-right:0}nav a{flex:1;flex-direction:column;font-size:11px;gap:0;padding:6px 2px;text-align:center}.brand{display:none}main{padding:12px;padding-bottom:90px}}
</style></head><body><div id="app"></div>

const ST={draft:['Draft','#64748b'],pending:['รอตรวจสอบ','#d97706'],needs_fix:['ต้องแก้ไข','#dc2626'],fix_review:['รอตรวจสอบการแก้ไข','#7c3aed'],pending_approval:['รออนุมัติ','#2563eb'],approved:['อนุมัติแล้ว','#16a34a']};

const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={projects:[],equipment_catalog:[],inspections:[],defects:[],status_log:[],notifications:[],settings:{max_items:10,max_photos:6,paper:'a4',company:'บริษัท เจริญโภคภัณฑ์วิศวกรรม จำกัด'}},me=JSON.parse(localStorage.me||'null'),sb=null,W=null,I=null;
const can=r=>me.role==r||me.role=='admin',proj=id=>S.projects.find(p=>p.id==id)||{},frm=c=>FORMS.find(f=>f.code==c)||{c:[],x:[]};
const fmt=d=>d?new Date(d).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'-',fd=d=>d?new Date(d).toLocaleDateString('th-TH'):'';
const pill=s=>`<span class=pill style="background:${ST[s][1]}">${ST[s][0]}</span>`;

/* ---------- data layer: IndexedDB (demo) or Supabase ---------- */
const idb=()=>new Promise(r=>{const q=indexedDB.open('smartqc',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const kv=async(m,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('k','readwrite').objectStore('k'),q=m=='get'?t.get('s'):t.put(v,'s');q.onsuccess=()=>r(q.result)})};
const persist=()=>kv('set',S);
async function up(v){if(typeof v!='string'||!v.startsWith('data:image'))return v;const b=await (await fetch(v)).blob(),p=uid()+'.'+(v.includes('png')?'png':'jpg');await sb.storage.from('qc-files').upload(p,b,{contentType:b.type});return sb.storage.from('qc-files').getPublicUrl(p).data.publicUrl}
async function deep(o){if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=await deep(o[i]);return o}if(o&&typeof o=='object'){for(const k in o)o[k]=await deep(o[k]);return o}return up(o)}
async function save(c,row){const a=S[c],i=a.findIndex(x=>x.id==row.id);if(c=='inspections')row.updated_at=now();i<0?a.unshift(row):a[i]=row;if(sb){try{await deep(row);const{error}=await sb.from(c).upsert(row);if(error)throw error}catch(e){toast('Cloud: '+e.message)}}await persist()}
async function saveSet(){if(sb)await sb.from('app_settings').upsert({key:'main',value:S.settings});await persist()}
async function mv(i,to,note,role,sig){const from=i.status;i.status=to;i.sigs=i.sigs||{};if(sig)i.sigs[role]={img:sig,name:me.name,at:now()};
await save('status_log',{id:uid(),inspection_id:i.id,from_status:from,to_status:to,actor_id:me.id,actor_name:me.name,actor_role:me.role,note:note||'',created_at:now()});
for(const r of NT[to]||[])await save('notifications',{id:uid(),to_role:r,inspection_id:i.id,text:`${i.doc_no} → ${ST[to][0]}`,read:false,created_at:now()});await save('inspections',i)}

return `<a href="#/status" class=m>← กลับ</a><div class=card><div class=m><b style="color:var(--t);font-size:17px">${h(I.doc_no)}</b>${pill(I.status)}</div><div>${f.code} ${h(f.s)}</div><div class=m>${h(proj(I.project_id).code)} ${h(proj(I.project_id).name)} · ตรวจ ${fmt(I.inspect_at)} · รอบที่ ${I.round}</div><div class=row><button class=b onclick="pdfDoc('${I.id}','insp')">📄 PDF ใบตรวจ</button>${D.length?`<button class=b onclick="pdfDoc('${I.id}','def')">⚠️ PDF Defect</button>`:''}<button class=b onclick="pdfDoc('${I.id}','insp',1)">📤 แชร์</button></div></div>
${I.status=='needs_fix'&&last?.note?`<div class=warn><b>หมายเหตุ:</b> ${h(last.note)}</div>`:''}
${I.items.map((it,i)=>`<div class=card><b>#${i+1} ${h(it.eq.name)}</b> <span class=m>${[it.eq.model,it.eq.pos,it.eq.drawing,...f.x.map(k=>it.eq[k]&&XF[k]+': '+it.eq[k])].filter(Boolean).map(h).join(' · ')}</span><div class=m>รูปจากผู้ติดตั้ง</div>${strip(it.photos)}${(it.eq.dwg||[]).length?`<div class=m>แบบ</div>${strip(it.eq.dwg)}`:''}
${f.c.map(([k,l])=>{const v=it.res[k];return `<div class=ck><span>${l}</span>${ed?`<div><button class="pf ${v=='pass'?'ok':''}" onclick="chk(${i},'${k}','pass')">ผ่าน</button><button class="pf ${v=='fail'?'no':''}" onclick="chk(${i},'${k}','fail')">ไม่ผ่าน</button></div>`:`<b style="color:${v=='pass'?'#16a34a':v=='fail'?'#dc2626':'var(--m)'}">${v=='pass'?'✓ ผ่าน':v=='fail'?'✗ ไม่ผ่าน':'-'}</b>`}</div>${v=='fail'?(ed?`<div class=fl><select onchange="it_s(${i},'${k}',this.value)"><option value=minor ${it.sev[k]!='major'?'selected':''}>Minor</option><option value=major ${it.sev[k]=='major'?'selected':''}>Major</option></select><input placeholder="รายละเอียดข้อบกพร่อง" value="${h(it.notes[k])}" onchange="it_n(${i},'${k}',this.value)"></div>`:`<div class=m>${it.sev[k]} · ${h(it.notes[k])}</div>`):''}`}).join('')}
<div class=m>รูปตรวจสอบ (ไฮไลต์)</div>${photoBox('I',i,'ipics',!ed)}${ed?`<input placeholder="หมายเหตุ" value="${h(it.remark)}" onchange="I.items[${i}].remark=this.value;persist()">`:it.remark?`<div class=m>หมายเหตุ: ${h(it.remark)}</div>`:''}</div>`).join('')}${act}
<div class=card><h3>ประวัติสถานะ</h3>${L.map(l=>`<div class=m>• ${fmt(l.created_at)} — ${ST[l.to_status][0]} · ${h(l.actor_name)} (${ROLES[l.actor_role]})${l.note?' · '+h(l.note):''}</div>`).join('')||'<span class=m>-</span>'}</div>`}
const chk=(i,k,v)=>{I.items[i].res[k]=v;persist();render()},it_s=(i,k,v)=>{I.items[i].sev[k]=v;persist()},it_n=(i,k,v)=>{I.items[i].notes[k]=v;persist()};
const defNo=()=>`FR-INS-ME-004-${proj(I.project_id).code}-${String(S.inspections.filter(x=>x.defect_no&&x.project_id==I.project_id).length+1).padStart(3,'0')}`;
async function decide(){const s=sigData('sg');if(!s)return toast('กรุณาเซ็นชื่อ');const f=frm(I.form_code);let fails=0;
for(const[i,it]of I.items.entries())for(const[k,l]of f.c){if(!it.res[k])return toast(`ยังไม่ได้ตรวจ: #${i+1} ${l}`);const id=`${I.id}:${i}:${k}`,ex=S.defects.find(d=>d.id==id);
if(it.res[k]=='fail'){fails++;await save('defects',{...(ex||{created_at:now()}),id,inspection_id:I.id,project_id:I.project_id,form_code:I.form_code,item_seq:i+1,equipment_name:it.eq.name,check_key:k,check_label:l,severity:it.sev[k]||'minor',description:it.notes[k]||'',photo_before:it.ipics[0]||it.photos[0]||null,photo_after:null,status:'open',round:I.round})}
else if(ex&&ex.status=='open')await save('defects',{...ex,status:'closed',fixed_at:now()})}
I.inspector_name=me.name;if(fails){I.defect_no=I.defect_no||defNo();await mv(I,'needs_fix',`พบข้อบกพร่อง ${fails} รายการ`,'inspector',s)}else await mv(I,'pending_approval','ผ่านทั้งหมด','inspector',s);render()}
async function defPh(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const d=S.defects.find(x=>x.id==id);d.photo_after=await comp(f.files[0]);await save('defects',d);render()};f.click()}
async function defNote(id,v){const d=S.defects.find(x=>x.id==id);d.fix_note=v;await save('defects',d)}
async function fixSub(){if(S.defects.some(d=>d.inspection_id==I.id&&d.status=='open'&&!d.photo_after))return toast('แนบรูปหลังแก้ไขให้ครบทุกข้อ');I.round++;await mv(I,'fix_review','ส่งตรวจสอบการแก้ไข');render()}
async function appr(ok){const s=sigData('sg');if(!s)return toast('กรุณาเซ็นชื่อ');let n='';if(!ok){n=prompt('เหตุผลที่ไม่อนุมัติ');if(!n)return}I.approver_name=me.name;await mv(I,ok?'approved':'needs_fix',n,'approver',s);render()}
/* ---------- 4 documents + defect knowledge base ---------- */
function docs(){const L=S.inspections.filter(i=>i.status=='approved'),K=S.defects.filter(d=>d.fix_note);
return `<h2>เอกสารที่อนุมัติแล้ว</h2><input placeholder="🔍 ค้นหาเลขที่เอกสาร / โครงการ" oninput="document.querySelectorAll('.dr').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(this.value.toLowerCase()))">${L.map(i=>`<div class="card dr"><div class=m><b style="color:var(--t)">${h(i.doc_no)}</b>${fd(i.updated_at)}</div><div>${h(frm(i.form_code).s)} · ${h(proj(i.project_id).code)}</div><div class=row><button class=b onclick="pdfDoc('${i.id}','insp')">📄 ดาวน์โหลด PDF</button>${i.defect_no?`<button class=b onclick="pdfDoc('${i.id}','def')">⚠️ Defect</button>`:''}<button class=b onclick="pdfDoc('${i.id}','insp',1)">📤 แชร์</button><a class=b style="text-align:center;text-decoration:none" href="#/insp/${i.id}">เปิดดู</a></div></div>`).join('')||'<div class="card m">ยังไม่มีเอกสารที่อนุมัติ</div>'}
<h2>คลังความรู้ Defect งานติดตั้ง</h2>${K.map(d=>`<div class="card dr"><b>${h(d.check_label)}</b> · ${h(frm(d.form_code).s)} <span class=pill style="background:${d.severity=='major'?'#dc2626':'#f59e0b'}">${d.severity}</span><div>${h(d.description)}</div><div class=m>วิธีแก้ไข: ${h(d.fix_note)}</div><div class=ph>${d.photo_before?`<img src="${d.photo_before}">`:''}${d.photo_after?`<img src="${d.photo_after}">`:''}</div></div>`).join('')||'<div class="card m">คลังความรู้จะเริ่มสะสมเมื่อผู้ติดตั้งบันทึกวิธีแก้ไข Defect</div>'}`}
/* ---------- 5 notifications / 6 settings ---------- */
function notif(){const L=S.notifications.filter(n=>n.to_role==me.role).sort((a,b)=>a.created_at<b.created_at?1:-1);L.filter(n=>!n.read).forEach(n=>{n.read=true;save('notifications',n)});return `<h2>การแจ้งเตือน</h2>${L.map(n=>`<a class="card li" href="#/insp/${n.inspection_id}">${h(n.text)}<div class=m>${fmt(n.created_at)}</div></a>`).join('')||'<div class="card m">ไม่มีการแจ้งเตือน</div>'}`}
function settings(){const a=me.role=='admin',s=S.settings;return `<h2>ตั้งค่า</h2><div class=card><h3>โปรไฟล์</h3><label>ชื่อ</label><input value="${h(me.name)}" onchange="me.name=this.value;pf()"><label>บริษัท</label><input value="${h(me.company)}" onchange="me.company=this.value;pf()"><label>อีเมล</label><input value="${h(me.email)}" onchange="me.email=this.value;pf()"><label>บทบาท (MVP: เปลี่ยนได้)</label><select onchange="me.role=this.value;pf();render()">${Object.entries(ROLES).map(([k,v])=>`<option value=${k} ${k==me.role?'selected':''}>${v}</option>`).join('')}</select>
<div class=row><button class=b onclick="localStorage.th=document.documentElement.dataset.theme=(localStorage.th=='dark'?'light':'dark')">🌓 Dark / Light</button><button class=b onclick="me=null;localStorage.removeItem('me');render()">Logout</button><button class="b d" onclick="if(confirm('ลบโปรไฟล์?')){me=null;localStorage.removeItem('me');render()}">ลบโปรไฟล์</button></div></div>
${a?`<div class=card><h3>Admin · ค่าระบบ</h3><label>จำนวนอุปกรณ์สูงสุด/ใบตรวจ</label><input type=number value="${s.max_items}" onchange="S.settings.max_items=+this.value;saveSet()"><label>จำนวนรูปสูงสุด/ช่อง</label><input type=number value="${s.max_photos}" onchange="S.settings.max_photos=+this.value;saveSet()"><label>ขนาดกระดาษ PDF</label><select onchange="S.settings.paper=this.value;saveSet()"><option value=a4 ${s.paper=='a4'?'selected':''}>A4 แนวนอน</option><option value=a3 ${s.paper=='a3'?'selected':''}>A3 แนวนอน (ตามต้นฉบับ)</option></select><label>ชื่อบริษัทหัวเอกสาร</label><input value="${h(s.company)}" onchange="S.settings.company=this.value;saveSet()"></div>
<div class=card><h3>Admin · โครงการ</h3>${S.projects.map(p=>`<div class=ck><span>${h(p.code)} ${h(p.name)}</span><button class="pf ${p.active!==false?'ok':''}" onclick="tp('${p.id}')">${p.active!==false?'Active':'ปิด'}</button></div>`).join('')}<input id=pc placeholder="รหัสโครงการ เช่น PJ68/075"><input id=pn placeholder="ชื่อโครงการ"><button class="b p" onclick="addP()">＋ เพิ่มโครงการ</button></div>
<div class=card><h3>Admin · เชื่อมต่อ Supabase</h3><input id=su placeholder="Project URL" value="${h(JSON.parse(localStorage.sbcfg||'{}').url)}"><input id=sk placeholder="anon key"><div class=row><button class="b p" onclick="localStorage.sbcfg=JSON.stringify({url:$('#su').value,key:$('#sk').value});location.reload()">เชื่อมต่อ & รีโหลด</button><button class=b onclick="localStorage.removeItem('sbcfg');location.reload()">กลับโหมดทดลอง</button></div></div>`:''}`}
const pf=()=>localStorage.me=JSON.stringify(me);
const tp=async id=>{const p=proj(id);p.active=p.active===false;await save('projects',p);render()};
async function addP(){const c=$('#pc').value.trim(),n=$('#pn').value.trim();if(!c||!n)return toast('กรอกรหัสและชื่อโครงการ');await save('projects',{id:uid(),code:c,name:n,owner_company:S.settings.company,active:true,created_at:now()});render()}
/* ---------- PDF (ISO layout, fixed template) ---------- */
const dim=()=>S.settings.paper=='a3'?[1587,1123,420,297]:[1123,794,297,210];
const pgW=(x,I_,t)=>{const[w,hh]=dim();return `<div class=pg style="width:${w}px;height:${hh}px"><div class=hd><img src="${LOGO}"><div><b>${h(S.settings.company)}</b>${t}</div><div class=bx style="flex:none;text-align:left">เลขที่เอกสาร: ${h(I_.doc_no)}<br>วันที่: ${fd(I_.inspect_at||I_.updated_at)}<br>โครงการ: ${h(proj(I_.project_id).code)} ${h(proj(I_.project_id).name)}</div></div>${x}<div class=ft><span>${h(frm(I_.form_code).code)}</span><span>หน้า %N / %T</span></div></div>`};
const sgB=(I_,r,l)=>{const s=I_.sigs?.[r];return `<div class=sg><b>${l}</b><div class=si>${s?`<img src="${s.img}">`:''}</div><div>(${s?h(s.name):'..............................'})</div><div>${s?fd(s.at):'........./......../............'}</div></div>`};
function pgCover(I_){const f=frm(I_.form_code),e=f.x,n=4+e.length+f.c.length*2+1;return pgW(`<table><tr><th rowspan=2 style="width:3.5%">ลำดับ</th><th rowspan=2 style="width:11%">รายการ</th><th rowspan=2>รุ่น</th><th rowspan=2>ตำแหน่ง</th><th rowspan=2>แบบ</th>${e.map(k=>`<th rowspan=2>${XF[k]}</th>`).join('')}${f.c.map(c=>`<th colspan=2>${c[1]}</th>`).join('')}<th rowspan=2 style="width:9%">หมายเหตุ</th></tr><tr>${f.c.map(()=>'<th>ผ่าน</th><th>ไม่ผ่าน</th>').join('')}</tr>${[...Array(10)].map((_,r)=>{const it=I_.items[r];return `<tr><td>${r+1}</td>${it?`<td class=l>${h(it.eq.name)}</td><td>${h(it.eq.model)}</td><td>${h(it.eq.pos)}</td><td>${h(it.eq.drawing)}</td>${e.map(k=>`<td>${h(it.eq[k])}</td>`).join('')}${f.c.map(([k])=>`<td>${it.res?.[k]=='pass'?'✓':''}</td><td class=x>${it.res?.[k]=='fail'?'✗':''}</td>`).join('')}<td class=l>${h(it.remark)}</td>`:'<td></td>'.repeat(n-1)}</tr>`}).join('')}</table><div class=sgs>${sgB(I_,'installer','ผู้ผลิต/ผู้ติดตั้ง')}${sgB(I_,'inspector','ผู้ตรวจสอบ')}${sgB(I_,'approver','ผู้อนุมัติ')}</div>`,I_,`<span>${h(f.s)}</span>`)}
const im=(a,n)=>`<div class=im style="height:${dim()[1]-250}px;grid-template-rows:repeat(${Math.ceil(n/2)},1fr)">${a.slice(0,n).map(s=>`<div><img src="${s}"></div>`).join('')}</div>`;
const pgEv=(I_,it,i)=>pgW(`<div style="margin-bottom:6px"><b>หลักฐานการตรวจ #${i+1}: ${h(it.eq.name)}</b> <span>${[it.eq.model,it.eq.pos,it.eq.drawing].filter(Boolean).map(h).join(' · ')}</span></div><div class=eg><div><h4>รูปการติดตั้ง (ผู้ผลิต/ผู้ติดตั้ง)${(it.eq.dwg||[]).length?' + แบบ':''}</h4>${im([...it.photos,...(it.eq.dwg||[])],6)}</div><div><h4>รูปตรวจสอบ/ไฮไลต์ (ผู้ตรวจสอบ)</h4>${im(it.ipics?.length?it.ipics:[],6)}</div></div>`,I_,'<span>ภาพหลักฐานการส่งตรวจ และตรวจสอบ</span>');
function pgsDef(I_){const D=S.defects.filter(d=>d.inspection_id==I_.id),c=[];for(let i=0;i<D.length;i+=4)c.push(D.slice(i,i+4));const hh=(dim()[1]-420)/4;
return c.map((ch,pi)=>pgW(`<div style="margin:4px 0">ถึง: ผู้แก้ไข(ผู้ประกอบ/ผู้ติดตั้ง) ${h(I_.installer_name)} · เรื่อง: Defect ของงาน ${h(I_.form_code)} (${h(frm(I_.form_code).s)}) · ออกเอกสารโดย: ${h(I_.inspector_name)}</div><table><tr><th style="width:5%">ลำดับ</th><th style="width:28%">รายละเอียดการแก้ไข</th><th style="width:25%">รูปถ่ายก่อนการแก้ไข</th><th style="width:25%">รูปถ่ายหลังการแก้ไข</th><th>หมายเหตุ</th></tr>${ch.map((d,k)=>`<tr style="height:${hh}px"><td>${pi*4+k+1}</td><td class=l><b>${h(d.equipment_name)}</b><br>${h(d.check_label)} (${d.severity})<br>${h(d.description)}</td><td>${d.photo_before?`<img src="${d.photo_before}" style="max-width:100%;max-height:${hh-8}px">`:''}</td><td>${d.photo_after?`<img src="${d.photo_after}" style="max-width:100%;max-height:${hh-8}px">`:''}</td><td class=l>${h(d.fix_note)}</td></tr>`).join('')}</table>${pi==c.length-1?`<div class=sgs>${sgB(I_,'installer','ผู้แก้ไข(ผู้ประกอบ/ผู้ติดตั้ง)')}${sgB(I_,'inspector','ผู้ตรวจสอบ')}${sgB(I_,'approver','ผู้อนุมัติ')}</div>`:''}`,{...I_,doc_no:I_.defect_no,form_code:'FR-INS-ME-004'},'<span>เอกสารแจ้งแก้ไขข้อบกพร่องงานผลิต และติดตั้ง</span>'))}
async function pdfDoc(id,kind,share){const x=S.inspections.find(q=>q.id==id),pages=kind=='def'?pgsDef(x):[pgCover(x),...x.items.map((it,i)=>pgEv(x,it,i))],name=(kind=='def'?x.defect_no:x.doc_no).replace(/\//g,'-')+'.pdf';toast('กำลังสร้าง PDF...');await document.fonts.ready;
const[,,mw,mh]=dim(),pdf=new jspdf.jsPDF({orientation:'l',unit:'mm',format:[mw,mh]}),box=document.createElement('div');box.style.cssText='position:fixed;left:-99999px;top:0';document.body.appendChild(box);
for(let n=0;n<pages.length;n++){box.innerHTML=pages[n].replace('%N',n+1).replace('%T',pages.length);await new Promise(r=>setTimeout(r,80));const cv=await html2canvas(box.firstElementChild,{scale:2,useCORS:true});if(n)pdf.addPage([mw,mh],'l');pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',0,0,mw,mh)}
box.remove();if(share&&navigator.canShare){const f=new File([pdf.output('blob')],name,{type:'application/pdf'});if(navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).catch(()=>{})}pdf.save(name)}
/* ---------- boot ---------- */
(async()=>{document.documentElement.dataset.theme=localStorage.th||'light';const c=JSON.parse(localStorage.sbcfg||'null');if(c&&window.supabase)sb=supabase.createClient(c.url,c.key);
if(sb){for(const t of['projects','equipment_catalog','inspections','defects','status_log','notifications']){const{data}=await sb.from(t).select('*');S[t]=data||[]}const{data:a}=await sb.from('app_settings').select('*').eq('key','main');if(a?.[0])S.settings={...S.settings,...a[0].value}}
else{const d=await kv('get');if(d)S=d;else{S.projects=[{id:uid(),code:'PJ68/074',name:'โรงสีข้าวพันทวี',owner_company:S.settings.company,active:true}];await persist()}}render()})();
</script></body></html>
