<style>
:root{--b:#0b6e4f;--bg:#f4f6f5;--t:#1a2321;--m:#6b7773;--r:#c0392b}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--b);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.demo{background:#f1c40f;color:#000;font-size:12px;padding:2px 8px;border-radius:9px;margin-left:8px}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.m{color:var(--m);font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;background:#e0e6e3}.chip.w{background:#fde7c8}.chip.o{background:#cdeedd}.chip.f{background:#f7d4d0}
button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcc7c3;width:100%;margin:4px 0}
button{background:var(--b);color:#fff;border:0;min-height:48px;cursor:pointer}button.s{background:#e0e6e3;color:var(--t)}button.d{background:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccc;z-index:4}nav a{flex:1;text-align:center;padding:10px 0;font-size:13px;cursor:pointer}nav a.on{color:var(--b);font-weight:700}

@media(min-width:900px){body{padding-left:180px}nav{top:0;bottom:auto;right:auto;width:180px;flex-direction:column;border:0;border-right:1px solid #ccc;padding-top:60px}nav a{text-align:left;padding:14px 20px;font-size:15px}header{margin-left:-180px;padding-left:196px}}
nav a{font-size:11px;line-height:1.3}nav a br{display:block}

.pg{position:fixed;left:-99999px;top:0;width:1123px;height:794px;background:#fff;color:#000;font:12px Sarabun,sans-serif;padding:22px 28px;box-sizing:border-box;overflow:hidden}.pg.pt{width:794px;height:1123px}
.pg .hd{display:flex;gap:14px;align-items:center;margin-bottom:8px}.pg .hd img{height:78px}.pg .tb{width:100%;border-collapse:collapse;margin-top:8px}.pg .tb th,.pg .tb td{border:1px solid #222;padding:2px 4px;height:25px;vertical-align:middle}.pg .tb th{background:#eee;font-weight:400}.pg .c{text-align:center}.pg .sm{font-size:10px}
.pg .sgs{display:flex;justify-content:space-around;margin-top:22px}.pg .sg{text-align:center;min-width:200px;font-size:13px}.pg .sg img{height:54px;display:block;margin:auto}.pg .sg:before{content:"";display:block;border-top:1px dotted #000;margin:0 10px 4px}
.pg .ft{position:absolute;left:28px;right:28px;bottom:14px;display:flex;justify-content:space-between;font-size:11px}
.pg .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.pg .gr figure{margin:0}.pg .gr img{width:100%;height:290px;object-fit:contain;background:#eee}.pg .gr.one{grid-template-columns:1fr}.pg .gr.one img{height:600px}
.pg .yb{background:#ff0;border:1px solid #222;text-align:center;font-weight:700;font-size:20px;margin-top:8px}.pg .dr{height:170px}.pg .dr img{max-width:100%;max-height:78px;margin:1px}
</style></head><body>
<header><div><b>SMART QC</b><span id="dm"></span></div><div id="hu"></div></header><main id="app"></main><nav id="nav"></nav>
<script>
const SUPABASE_URL='https://oanyvtudtdlhmynicjvw.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hbnl2dHVkdGRsaG15bmljanZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTQzNTcsImV4cCI6MjEwNjc5MDM1N30.PNsEfCQ6kj2Y-03J0VCcw2VqtLozi2bA2TMenN3nGPw';
const MAX_ITEMS=5; // ค่าสูงสุดที่ฝั่ง DB คุม (system_settings.max_items, ไม่เกิน 10)
const DEMO=SUPABASE_URL.startsWith('YOUR_');
const sb=DEMO?null:supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={DRAFT:'ร่าง',WAITING_INSPECTION:'รอตรวจ',INSPECTING:'กำลังตรวจ',CORRECTION_REQUIRED:'ต้องแก้ไข',FAILED:'ไม่ผ่าน (ครั้งก่อน)',WAITING_APPROVAL:'รออนุมัติ',APPROVED:'อนุมัติแล้ว'};
const ME={FACTORY:'โรงงาน',SITE:'ไซต์งานติดตั้ง',ONLINE:'ตรวจออนไลน์'};
const RL={manufacturer:'ผู้ผลิต',installer:'ผู้ติดตั้ง',inspector:'ผู้ตรวจ',approver:'ผู้อนุมัติ',visitor:'ผู้เยี่ยมชม',admin:'แอดมิน'};
const blank=()=>({pid:'',vid:'',method:'FACTORY',when:'',note:'',items:[{name:'',model:'',qty:1,note:'',f:[]}]});
let S={user:null,role:null,prof:null,view:'home',meta:{projects:[],forms:[]},list:[],cur:null,res:[],filter:'',draft:null};
try{S.draft=JSON.parse(localStorage.qcDraft||'null')}catch(e){}
S.draft=S.draft||blank();S.draft.items.forEach(i=>i.f=[]);
const saveDraft=()=>localStorage.qcDraft=JSON.stringify(S.draft,(k,v)=>k==='f'?undefined:v);
const mk=(c,n,l,o={})=>({vid:'v'+c,code:c,name:n,...o,cl:l.map((x,k)=>({id:c+k,label:x}))});
const D=JSON.parse(localStorage.qcDemo||'null')||{p:[{id:'p1',code:'PJ69.074',name:'งานโคราช'}],f:[mk('FR-INS-ME-028','แบบฟอร์มการตรวจเช็คแผ่นตะแกรงถังอบ',['ความหนา','ความสูง','เส้นรอบรูป','ระยะรูตะแกรง']),mk('FR-INS-ME-024','แบบฟอร์มการตรวจสอบงานติดตั้งระบบท่อส่งข้าว',['องศาท่อ','ความคดงอท่อ','การจับยึด','จุดรั่ว,รอยต่อ','จุดค้ำยัน','อัตราการไหล','งานสี/ความเรียบร้อย'])],i:[],r:[],d:[],doc:[],seq:{}};
const dsave=()=>localStorage.qcDemo=JSON.stringify(D),nx=k=>D.seq[k]=(D.seq[k]||0)+1,uid=()=>'x'+Date.now()+Math.random().toString(36).slice(2,6);
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)};
async function run(f,ok){try{await f();ok&&toast(ok);return true}catch(e){console.error(e);const m=e.message||'';toast(m.includes('QC:')?m.split('QC:')[1]:m.includes('row-level')?'ไม่มีสิทธิ์ดำเนินการ':'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');return false}}
const comp=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};im.src=URL.createObjectURL(f)});
function sign(){return new Promise(res=>{const m=document.createElement('div');m.style='position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center';m.innerHTML='<div class=card style="width:92%;max-width:420px"><b>ลงลายมือชื่อ</b><canvas width=380 height=160 style="border:1px dashed #888;width:100%;touch-action:none;background:#fff"></canvas><button class=s id=sc>ล้าง</button><button id=so>ยืนยัน</button><button class=s id=sx>ยกเลิก</button></div>';document.body.append(m);const c=m.querySelector('canvas'),x=c.getContext('2d');x.lineWidth=2;let dn=0,has=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{dn=1;x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(dn){x.lineTo(...p(e));x.stroke();has=1}};c.onpointerup=()=>dn=0;m.querySelector('#sc').onclick=()=>{x.clearRect(0,0,380,160);has=0};m.querySelector('#sx').onclick=()=>{m.remove();res(null)};m.querySelector('#so').onclick=()=>{if(!has)return toast('กรุณาเซ็นชื่อ');const d=c.toDataURL();m.remove();res(d)}})}

// ===== data layer (Supabase หรือ DEMO ในเครื่อง) =====
const fm=i=>S.meta.forms.find(f=>f.vid===i.vid)||{cl:[],code:'?',name:'?'};
function drpc(n,a){const i=D.i.find(x=>x.id===a.p_id),f=i&&fm(i),pc=i&&D.p.find(p=>p.id===i.pid).code;
 if(n==='submit_correction'){const d=D.d.find(x=>x.id===a.p_defect);if(!(a.p_note||'').trim())throw Error('QC: กรุณาอธิบายการแก้ไข');d.status='CORRECTED';d.correction_note=a.p_note}
 else if(n==='start_inspection')i.status='INSPECTING';
 else if(n==='finalize_inspection'){const R=D.r.filter(r=>r.inspection_id===i.id);if(i.items.some(it=>f.cl.some(c=>!R.find(r=>r.item_id===it.id&&r.checklist_id===c.id&&r.result))))throw Error('QC: ผลตรวจยังไม่ครบทุกรายการ');const fl=R.filter(r=>r.result==='FAIL');if(fl.some(r=>!(r.comment||'').trim()))throw Error('QC: ข้อที่ไม่ผ่านต้องระบุเหตุผล');i.sig=1;fl.forEach(r=>D.d.push({id:uid(),inspection_id:i.id,number:'FR-INS-ME-004-'+pc+'-'+String(nx('D'+pc)).padStart(3,'0'),description:f.cl.find(c=>c.id===r.checklist_id).label+': '+r.comment,status:'OPEN'}));i.status=fl.length?'CORRECTION_REQUIRED':'WAITING_APPROVAL'}
 else if(n==='approve_inspection'){if(!a.p_ok){if(!(a.p_comment||'').trim())throw Error('QC: ไม่อนุมัติต้องระบุเหตุผล');i.status='INSPECTING'}else{i.status='APPROVED';D.doc.push({id:uid(),inspection_id:i.id,document_number:f.code+'-'+pc+'-'+String(nx('DOC'+f.code+pc)).padStart(3,'0'),status:'APPROVED'});D.d.filter(d=>D.i.find(x=>x.id===d.inspection_id).number===i.number).forEach(d=>d.status='CLOSED')}}
 else if(n==='resubmit_inspection'){if(D.d.some(d=>d.inspection_id===i.id&&d.status==='OPEN'))throw Error('QC: ยังมี Defect ที่ไม่ได้แก้ไข');i.status='FAILED';D.d.filter(d=>d.inspection_id===i.id).forEach(d=>d.status='REINSPECTION_REQUIRED');const id=uid();D.i.push({...i,id,attempt:i.attempt+1,status:'WAITING_INSPECTION',items:i.items.map(t=>({...t,id:uid()}))})}
 dsave()}
const api={
 async meta(){if(DEMO)return{projects:D.p,forms:D.f};
  const[p,f]=await Promise.all([sb.from('projects').select('*').order('code'),sb.from('form_versions').select('id,item_fields,forms!inner(code,name,kind,signer_label,model_label,has_standard,qty_unit),form_checklists(id,sort,label,source_review)').eq('is_active',true)]);if(p.error||f.error)throw p.error||f.error;
  return{projects:p.data,forms:f.data.filter(x=>x.forms.kind==='inspection').map(x=>({vid:x.id,code:x.forms.code,name:x.forms.name,fields:x.item_fields||[],signer:x.forms.signer_label,ml:x.forms.model_label,std:x.forms.has_standard,qu:x.forms.qty_unit,cl:x.form_checklists.sort((a,b)=>a.sort-b.sort).map(c=>({id:c.id,label:c.label,review:c.source_review}))})).sort((a,b)=>a.code.localeCompare(b.code))}},
 async list(){if(DEMO)return D.i.map(x=>({...x,project:D.p.find(p=>p.id===x.pid),defects:D.d.filter(d=>d.inspection_id===x.id)})).reverse();
  const{data,error}=await sb.from('inspections').select('id,number,status,attempt,method,note,requested_at,created_at,project_id,form_version_id,projects(code,name),companies(name),inspection_items(*),defects(*)').order('created_at',{ascending:false}).limit(50);if(error)throw error;
  return data.map(x=>({...x,vid:x.form_version_id,project:x.projects,company:x.companies,items:(x.inspection_items||[]).sort((a,b)=>a.sort-b.sort)}))},
 async res(id){if(DEMO)return D.r.filter(r=>r.inspection_id===id);const{data,error}=await sb.from('inspection_checklist_results').select('*').eq('inspection_id',id);if(error)throw error;return data},
 async setRes(iid,item_id,checklist_id,p){if(DEMO){let r=D.r.find(r=>r.item_id===item_id&&r.checklist_id===checklist_id);if(!r)D.r.push(r={inspection_id:iid,item_id,checklist_id});Object.assign(r,p);return dsave()}
  const{error}=await sb.from('inspection_checklist_results').upsert({inspection_id:iid,item_id,checklist_id,inspected_by:S.user.id,...p},{onConflict:'item_id,checklist_id'});if(error)throw error},
 async rpc(n,a){if(DEMO)return drpc(n,a);const{data,error}=await sb.rpc(n,a);if(error)throw error;return data},
 async docs(){if(DEMO)return D.doc;const{data,error}=await sb.from('documents').select('*').order('created_at',{ascending:false}).limit(50);if(error)throw error;return data},
 async create(d){const n=d.items.length;
  if(DEMO){const id=uid(),y=new Date().getFullYear();D.i.push({id,number:'INS-'+y+'-'+String(nx('INS'+y)).padStart(4,'0'),status:'WAITING_INSPECTION',attempt:1,pid:d.pid,vid:d.vid,method:d.method,when:d.when,note:d.note,items:d.items.map(t=>({id:uid(),name:t.name,model:t.model,qty:t.qty,note:t.note,extra:t.extra||{},photos:t.f.length}))});(D.sg=D.sg||[]).push({inspection_id:id,action:'SUBMITTED',image:d.sig,signed_at:new Date().toISOString()});return dsave()}
  const{data:i,error}=await sb.from('inspections').insert({project_id:d.pid,form_version_id:d.vid,company_id:S.prof.company_id,submitted_by:S.user.id,method:d.method,requested_at:d.when||null,note:d.note}).select().single();if(error)throw error;
  const{data:its,error:e2}=await sb.from('inspection_items').insert(d.items.map((t,k)=>({inspection_id:i.id,sort:k+1,name:t.name,model:t.model,qty:t.qty,note:t.note,extra:t.extra||{}}))).select();if(e2)throw e2;
  its.sort((a,b)=>a.sort-b.sort);
  for(let k=0;k<n;k++)for(const f of d.items[k].f){const b=await comp(f),path=i.id+'/'+its[k].id+'/'+Date.now()+Math.random().toString(36).slice(2,6)+'.jpg';
   let up;for(let t=0;t<3;t++){up=await sb.storage.from('inspection-photos').upload(path,b,{contentType:'image/jpeg'});if(!up.error)break}if(up.error)throw up.error;
   await sb.from('inspection_media').insert({inspection_id:i.id,item_id:its[k].id,uploaded_by:S.user.id,category:'SUBMISSION',storage_path:path,original_filename:f.name,mime_type:'image/jpeg',file_size:b.size})}
  for(const b of S.dw||[]){const p=i.id+'/'+uid()+'.jpg',u=await sb.storage.from('drawings').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;const{error:e3}=await sb.from('inspection_drawings').insert({inspection_id:i.id,uploaded_by:S.user.id,storage_path:p});if(e3)throw e3}
  d.sig&&await api.rpc('add_submit_sig',{p_id:i.id,p_sig:d.sig});await api.rpc('submit_inspection',{p_id:i.id});S.dw=[]}};

// ===== views =====
const ext=()=>['manufacturer','installer'].includes(S.role),isIns=()=>['inspector','admin'].includes(S.role),isApp=()=>['approver','admin'].includes(S.role);
const chip=s=>`<span class="chip ${s==='APPROVED'?'o':s==='CORRECTION_REQUIRED'||s==='FAILED'?'f':'w'}">${ST[s]||s}</span>`;
const card=i=>`<div class=card onclick="open_('${i.id}')" style="cursor:pointer"><b>${esc(fm(i).code)}</b> ${chip(i.status)}<div>${esc(i.project?.code)} ${esc(i.project?.name)}</div><div class=m>${esc(i.number||'ฉบับร่าง')} · Attempt ${i.attempt} · ${ME[i.method]||''} · ${i.items.length} รายการ</div></div>`;
const V={
 home(){const c=s=>S.list.filter(i=>s.includes(i.status)).length;
  return`<div class=g>${[['รอตรวจ',c(['WAITING_INSPECTION'])],['กำลังตรวจ',c(['INSPECTING'])],['ต้องแก้ไข',c(['CORRECTION_REQUIRED'])],['รออนุมัติ',c(['WAITING_APPROVAL'])],['อนุมัติแล้ว',c(['APPROVED'])],['Defect เปิดอยู่',S.list.reduce((n,i)=>n+i.defects.filter(d=>d.status==='OPEN').length,0)]].map(x=>`<div class=card><div class=m>${x[0]}</div><b style="font-size:28px">${x[1]}</b></div>`).join('')}</div>${ext()?'<button onclick="go(\'new\')">+ แจ้งตรวจ</button>':''}<h3>ล่าสุด</h3>${S.list.slice(0,5).map(card).join('')||'<div class="card m">ยังไม่มีรายการ</div>'}`},
 list(){const L=S.list.filter(i=>!S.filter||i.status===S.filter);return`<select onchange="S.filter=this.value;render()"><option value="">ทุกสถานะ</option>${Object.keys(ST).map(k=>`<option value=${k} ${S.filter===k?'selected':''}>${ST[k]}</option>`)}</select>${L.map(card).join('')||'<div class="card m">ไม่พบรายการ</div>'}`},
 new(){const d=S.draft,f=S.meta.forms.find(x=>x.vid===d.vid);
  return`<div class=card><b>ข้อมูลการตรวจ</b><select onchange="up('pid',this.value)"><option value="">เลือกโครงการ</option>${S.meta.projects.map(p=>`<option value="${p.id}" ${d.pid===p.id?'selected':''}>${esc(p.code)} — ${esc(p.name)}</option>`)}</select>
  <select onchange="up('vid',this.value);render()"><option value="">เลือกแบบฟอร์ม</option>${S.meta.forms.map(x=>`<option value="${x.vid}" ${d.vid===x.vid?'selected':''}>${esc(x.code)} ${esc(x.name)}</option>`)}</select>
  ${f?`<div class=m>เช็คลิสต์: ${f.cl.map(c=>esc(c.label)).join(' · ')}</div>`:''}
  <select onchange="up('method',this.value)">${Object.keys(ME).map(k=>`<option value=${k} ${d.method===k?'selected':''}>${ME[k]}</option>`)}</select>
  <input type=datetime-local value="${esc(d.when)}" onchange="up('when',this.value)"><textarea placeholder="หมายเหตุทั่วไป" oninput="up('note',this.value)">${esc(d.note)}</textarea></div>
  ${d.items.map((t,n)=>`<div class=card><b>รายการ ${n+1} / ${d.items.length}</b>${d.items.length>1?`<button class="s" onclick="rm(${n})">ลบรายการนี้</button>`:''}<input placeholder="รายการ เช่น ตะแกรงถังอบ A-01" value="${esc(t.name)}" oninput="upi(${n},'name',this.value)"><input placeholder="รุ่น/แบบ/ตำแหน่ง" value="${esc(t.model)}" oninput="upi(${n},'model',this.value)">${xf(n,t,f)}<input placeholder="หมายเหตุ" value="${esc(t.note)}" oninput="upi(${n},'note',this.value)">
  <label class=m>📷 รูปหลักฐาน (${t.f.length} รูป)<input type=file accept="image/*" capture=environment multiple onchange="addF(${n},this.files)"></label></div>`).join('')}
  <div class=card><b>แบบ (Drawing)</b><div class=m>เลือกภาพแบบ แล้ววงกลม/วาด/ไฮไลท์จุดติดตั้ง (หากเป็น PDF ให้แคปเป็นภาพก่อน)</div><input type=file accept="image/*" onchange="addD(this.files[0]);this.value=''"><div class=m>แนบแล้ว ${S.dw.length} ภาพ</div></div><button class=s onclick="add()" ${d.items.length>=MAX_ITEMS?'disabled':''}>+ เพิ่มรายการ (${d.items.length}/${MAX_ITEMS})</button><button onclick="submit()">ส่งแจ้งตรวจ</button><div class=m>ฉบับร่างบันทึกอัตโนมัติ (รูปภาพต้องเลือกใหม่หากรีเฟรชหน้า)</div>`},
 detail(){const i=S.cur,f=fm(i),r=S.res,edit=isIns()&&i.status==='INSPECTING',A=[];
  if(isIns()&&i.status==='WAITING_INSPECTION')A.push(['start','เริ่มตรวจ','']);if(edit)A.push(['fin','ส่งผลตรวจ + เซ็น','']);
  if(isApp()&&i.status==='WAITING_APPROVAL')A.push(['ok','อนุมัติ + เซ็น',''],['no','ไม่อนุมัติ','d']);
  if(ext()&&i.status==='CORRECTION_REQUIRED'&&i.defects.length&&i.defects.every(d=>d.status!=='OPEN'))A.push(['re','แจ้งตรวจซ้ำ','']);
  return`<button class=s onclick="go('list')">← กลับ</button><div class=card><b>${esc(f.code)}</b> ${chip(i.status)}<div>${esc(f.name)}</div><div class=m>${esc(i.number||'')} · Attempt ${i.attempt} · ${esc(i.project?.code)}</div></div>
  ${i.defects.map(d=>`<div class="card" style="border-left:4px solid var(--r)"><b>${esc(d.number)}</b> <span class=chip>${d.status}</span><div>${esc(d.description)}</div>${d.correction_note?`<div class=m>แก้ไข: ${esc(d.correction_note)}</div>`:''}${ext()&&d.status==='OPEN'&&i.status==='CORRECTION_REQUIRED'?`<textarea id="c_${d.id}" placeholder="อธิบายการแก้ไข"></textarea><button onclick="corr('${d.id}')">ส่งการแก้ไข</button>`:''}</div>`).join('')}
  ${i.items.map((t,n)=>`<div class=card><b>${n+1}. ${esc(t.name)}</b><div class=m>${esc(t.model)} · จำนวน ${t.qty??1}${t.note?' · '+esc(t.note):''}</div>${f.cl.map(c=>{const x=r.find(q=>q.item_id===t.id&&q.checklist_id===c.id)||{};return`<div style="border-top:1px solid #eee;padding:6px 0">${esc(c.label)}${c.review?' <span class=chip>SOURCE_REVIEW_REQUIRED</span>':''}${edit?`<div class=g><button class="${x.result==='PASS'?'':'s'}" onclick="setR('${t.id}','${c.id}','PASS')">ผ่าน</button><button class="${x.result==='FAIL'?'d':'s'}" onclick="setR('${t.id}','${c.id}','FAIL')">ไม่ผ่าน</button></div>${x.result==='FAIL'?`<textarea placeholder="เหตุผล (จำเป็น)" onchange="cm('${t.id}','${c.id}',this.value)">${esc(x.comment)}</textarea>`:''}`:` <span class="chip ${x.result==='FAIL'?'f':x.result?'o':''}">${x.result==='PASS'?'ผ่าน':x.result==='FAIL'?'ไม่ผ่าน':'-'}</span> ${esc(x.comment)}`}</div>`}).join('')}</div>`).join('')}
  ${A.map(a=>`<button class="${a[2]}" onclick="act('${a[0]}')">${a[1]}</button>`).join('')}`},

window.cm=async(it,cl,v)=>{const x=S.res.find(q=>q.item_id===it&&q.checklist_id===cl);x.comment=v;await run(()=>api.setRes(S.cur.id,it,cl,{comment:v}))};
window.corr=async id=>{const n=$('#c_'+id).value;if(await run(()=>api.rpc('submit_correction',{p_defect:id,p_note:n}),'ส่งการแก้ไขแล้ว'))await go('list',S.cur.id)};
window.act=async k=>{const i=S.cur;let r;
 if(k==='start')r=await run(()=>api.rpc('start_inspection',{p_id:i.id}),'เริ่มตรวจแล้ว');
 else if(k==='re')r=await run(()=>api.rpc('resubmit_inspection',{p_id:i.id}),'แจ้งตรวจซ้ำแล้ว');
 else{let c=null;if(k==='no'){c=prompt('เหตุผลที่ไม่อนุมัติ (จำเป็น)');if(!c)return}const sg=k==='no'?null:await sign();if(k!=='no'&&!sg)return;
  r=await run(()=>api.rpc(k==='fin'?'finalize_inspection':'approve_inspection',k==='fin'?{p_id:i.id,p_sig:sg}:{p_id:i.id,p_ok:k==='ok',p_comment:c,p_sig:sg}),'บันทึกแล้ว')}
 if(r)go('list')};

function annot(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),W=im.width*k,H=im.height*k,m=document.createElement('div');m.style='position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:8px';
 m.innerHTML=`<div style="background:#fff;padding:8px;border-radius:12px;max-width:1000px;margin:auto"><div class=g><button class=s id=t1>✏️ ปากกา</button><button class=s id=t2>⭕ วงกลม</button><button class=s id=t3>🖍 ไฮไลท์</button><button class=s id=un>↩ ย้อน</button></div><canvas width=${W} height=${H} style="width:100%;touch-action:none"></canvas><button id=ok>บันทึกแบบ</button><button class=s id=cx>ยกเลิก</button></div>`;document.body.append(m);
 const c=m.querySelector('canvas'),x=c.getContext('2d');let tool=1,st=[],cur=null;
 const draw=()=>{x.drawImage(im,0,0,W,H);[...st,cur].filter(Boolean).forEach(s=>{x.beginPath();x.lineCap='round';x.strokeStyle=s.t===3?'rgba(255,225,0,.45)':'#e11';x.lineWidth=s.t===3?22:4;if(s.t===2){const[a,b]=s.p[0],[e,f]=s.p[s.p.length-1];x.ellipse((a+e)/2,(b+f)/2,Math.abs(e-a)/2||1,Math.abs(f-b)/2||1,0,0,7)}else s.p.forEach((q,n)=>n?x.lineTo(...q):x.moveTo(...q));x.stroke()})};
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 c.onpointerdown=e=>{cur={t:tool,p:[p(e)]}};c.onpointermove=e=>{if(!cur)return;tool===2?cur.p[1]=p(e):cur.p.push(p(e));draw()};c.onpointerup=()=>{cur&&st.push(cur);cur=null;draw()};
 [1,2,3].forEach(n=>m.querySelector('#t'+n).onclick=()=>tool=n);m.querySelector('#un').onclick=()=>{st.pop();draw()};m.querySelector('#cx').onclick=()=>{m.remove();res(null)};m.querySelector('#ok').onclick=()=>c.toBlob(b=>{m.remove();res(b)},'image/jpeg',.85);draw()};im.src=URL.createObjectURL(file)})}
window.addD=async f=>{if(!f)return;const b=await annot(f);if(b){S.dw.push(b);render()}};
// ----- PDF ตามรูปแบบฟอร์ม -----
const hd=(i,t)=>`<div class=hd><img src="${LOGO}"><div><b style="font-size:20px">บริษัท เจริญโภคภัณฑ์วิศวกรรม จำกัด</b><div style="font-size:16px"><b>${esc(t)}</b></div><div>โครงการ: ${esc(i.project?.code)} ${esc(i.project?.name)} &nbsp;&nbsp; บริษัท: ${esc(i.company?.name||'')} &nbsp;&nbsp; วันที่: ${TH(i.requested_at||i.when||i.created_at)}</div></div></div>`;
const ft=(f,no,pg)=>`<div class=ft><span>${f.code}</span><span>${esc(no||'')}</span><span>${pg||'เอกสารแนบ'}</span></div>`;
function cover(i,f,R,SG,no){const cl=f.cl,fl=f.fields||[],q=hq(f),sg=a=>SG.filter(s=>s.action===a).pop()||{},
 sb_=(l,a)=>{const s=sg(a);return`<div class=sg>${s.image?`<img src="${s.image}">`:'<div style="height:54px"></div>'}<div>${l}</div><div class=sm>${s.signed_at?TH(s.signed_at):'....../....../......'}</div></div>`},
 rows=[...Array(13)].map((_,n)=>{const t=i.items[n],rs=t?cl.map(c=>R.find(x=>x.item_id===t.id&&x.checklist_id===c.id)||{}):[],rm=t?[t.note,...cl.map((c,k)=>rs[k].result==='FAIL'?c.label+': '+(rs[k].comment||''):'')].filter(Boolean).join(' / '):'';
  return`<tr><td class=c>${t?n+1:''}</td><td>${t?esc(t.name):''}</td><td>${t?esc(t.model):''}</td>${fl.map(x=>`<td class=c>${t?esc((t.extra||{})[x.k]||''):''}</td>`).join('')}${q?`<td class=c>${t?t.qty??'':''}</td>`:''}${cl.map((c,k)=>['PASS','FAIL'].map(v=>`<td class=c>${rs[k]?.result===v?'✓':''}</td>`).join('')).join('')}<td class=sm>${esc(rm)}</td></tr>`}).join('');
 return`${hd(i,f.name)}<table class=tb><tr><th rowspan=2>ลำดับ</th><th rowspan=2>รายการ</th><th rowspan=2>${f.ml||'รุ่น/แบบ/ตำแหน่ง'}</th>${fl.map(x=>`<th rowspan=2>${esc(x.l)}</th>`).join('')}${q?`<th rowspan=2>จำนวน${f.qu?' ('+f.qu+')':''}</th>`:''}${cl.map(c=>`<th colspan=2>${esc(c.label)}</th>`).join('')}<th rowspan=2>หมายเหตุ</th></tr><tr>${cl.map(()=>'<th>ผ่าน</th><th>ไม่ผ่าน</th>').join('')}</tr>${rows}</table>
 <div class=sgs>${sb_(f.signer||'ผู้ติดตั้ง','SUBMITTED')}${sb_('ผู้ตรวจสอบ','INSPECTED')}${sb_('ผู้อนุมัติ','APPROVED')}</div>${f.std?'<div style="margin-top:6px"><b><u>มาตรฐานงานตรวจสอบ</u></b></div>':''}${ft(f,no,'1/1')}`}
const photoP=(i,f,t,ims,one)=>`${hd(i,t)}<div class="gr${one?' one':''}">${ims.map(m=>`<figure><img src="${m.d}"><figcaption>${esc(m.cap)}</figcaption></figure>`).join('')}</div>${ft(f)}`;
function defectP(i,f,ds,M,SG,no){const s=SG.filter(x=>x.action==='INSPECTED').pop()||{},im=a=>a.slice(0,2).map(m=>`<img src="${m.d}">`).join('');
 return`<div class=hd><img src="${LOGO}"><div><b style="font-size:20px">บริษัท เจริญโภคภัณฑ์วิศวกรรม จำกัด</b><div class=sm>97 ถนนเย็นจิต แขวงทุ่งวัดดอน เขตสาทร กรุงเทพฯ 10120</div></div></div><div class=yb>บันทึก</div>
 <table class=tb style="margin:0"><tr><td style="width:60%">ถึง : ${esc(i.company?.name||'')}</td><td>เลขที่ : ${esc(no)}</td></tr><tr><td>โครงการ : ${esc(i.project?.code)} ${esc(i.project?.name)}</td><td>วันที่ : ${TH(new Date())}</td></tr><tr><td colspan=2>เรื่อง : แจ้งแก้ไขงานตรวจ ${f.code} ${esc(f.name)} (${esc(i.number||'')})</td></tr></table>
 <table class=tb style="height:760px"><tr style="height:24px"><th>ลำดับ</th><th>รูปถ่ายก่อนการแก้ไข</th><th>รายละเอียดงาน</th><th>รูปถ่ายหลังการแก้ไข</th><th>หมายเหตุ</th></tr>${[0,1,2,3].map(n=>{const d=ds[n];if(!d)return'<tr><td></td><td></td><td></td><td></td><td></td></tr>';const b=M.filter(m=>m.d&&m.item_id===d.item_id&&m.category==='INSPECTOR'),a=M.filter(m=>m.d&&m.defect_id===d.id);return`<tr class=dr><td class=c>${n+1}</td><td class=c>${im(b)}</td><td>${esc(d.description)}</td><td class=c>${im(a)}</td><td class=sm>${esc(d.correction_note||'')}</td></tr>`}).join('')}</table>
 <div class=sgs style="justify-content:flex-end"><div class=sg>${s.image?`<img src="${s.image}">`:''}<div>ผู้บันทึก</div><div class=sm>${s.signed_at?TH(s.signed_at):'....../....../......'}</div></div></div><div class=ft><span>FR-INS-ME-004</span><span></span><span>1/1</span></div>`}
async function buildPdf(id,docNo){await document.fonts.load('12px Sarabun');
 const i=(await api.list()).find(x=>x.id===id),f=fm(i),[R,M,DW,SG]=await Promise.all([api.res(id),api.media(id),api.drawings(id),api.sigs(id)]);
 await Promise.all([...M,...DW].map(async m=>{m.d=await u2d(m.url).catch(()=>null)}));
 let pdf;const snap=async(h,land)=>{const w=document.createElement('div');w.className='pg'+(land?'':' pt');w.innerHTML=h;document.body.append(w);const c=await html2canvas(w,{scale:2,backgroundColor:'#fff'});w.remove();const jp=window.jspdf.jsPDF;if(!pdf)pdf=new jp({orientation:land?'l':'p',unit:'mm',format:'a4'});else pdf.addPage('a4',land?'l':'p');pdf.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,land?297:210,land?210:297)};
 await snap(cover(i,f,R,SG,docNo),1);
 const cap=m=>{const n=i.items.findIndex(t=>t.id===m.item_id);return n<0?'':'รายการ '+(n+1)+': '+i.items[n].name};
 for(const[c,t]of[['SUBMISSION','รูปภาพส่งตรวจ'],['INSPECTOR','รูปภาพตรวจสอบ']]){const a=M.filter(m=>m.category===c&&m.d).map(m=>({d:m.d,cap:cap(m)}));for(let k=0;k<a.length;k+=6)await snap(photoP(i,f,t,a.slice(k,k+6)),1)}
 for(const w of DW.filter(x=>x.d))await snap(photoP(i,f,'แบบ (Drawing)',[{d:w.d,cap:'แบบ/ตำแหน่งติดตั้ง'}],1),1);
 for(let k=0;k<i.defects.length;k+=4){const ds=i.defects.slice(k,k+4);await snap(defectP(i,f,ds,M,SG,ds[0].number),0)}
 return{blob:pdf.output('blob'),name:(docNo||i.number||'QC')+'.pdf'}}
const dlb=p=>{const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=p.name;a.click()};
async function finishDoc(n){const dn=(n.status==='APPROVED'?await api.docOf(n.id):n.defects[0]?.number)||'',p=await buildPdf(n.id,dn);if(DEMO)return dlb(p);const path=n.id+'/'+(dn||n.number)+'.pdf',u=await sb.storage.from('documents').upload(path,p.blob,{contentType:'application/pdf'});if(u.error)throw u.error;await api.rpc('attach_document',{p_insp:n.id,p_path:path,p_number:dn||null})}
// ----- views -----
V.detail=()=>{const i=S.cur,f=fm(i),r=S.res,edit=isIns()&&i.status==='INSPECTING',A=[],img=m=>`<a href="${m.url}" target=_blank><img src="${m.url}" title="${CAT[m.category]||''}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;margin:2px;border:2px solid ${m.category==='INSPECTOR'?'#0b6e4f':'#ddd'}"></a>`,cam=(fn,lb)=>`<label class=m>📷 ${lb}<input type=file accept="image/*" capture=environment multiple onchange="${fn}(this.files)"></label>`;
 if(isIns()&&i.status==='WAITING_INSPECTION')A.push(['start','เริ่มตรวจ','']);if(edit)A.push(['fin','ส่งผลตรวจ + เซ็น','']);
 if(isApp()&&i.status==='WAITING_APPROVAL')A.push(['ok','อนุมัติ + เซ็น',''],['no','ไม่อนุมัติ','d']);
 if(ext()&&i.status==='CORRECTION_REQUIRED'&&i.defects.length&&i.defects.every(d=>d.status!=='OPEN'))A.push(['re','แจ้งตรวจซ้ำ','']);
 if(i.status!=='DRAFT')A.push(['pdf','📄 ดูตัวอย่าง/ดาวน์โหลด PDF','s']);
 return`<button class=s onclick="go('list')">← กลับ</button><div class=card><b>${esc(f.code)}</b> ${chip(i.status)}<div>${esc(f.name)}</div><div class=m>${esc(i.number||'')} · Attempt ${i.attempt} · ${esc(i.project?.code)} · ${ME[i.method]||''}${i.requested_at?' · นัดตรวจ '+TH(i.requested_at):''}</div>${S.drw.length?'<div class=m>แบบ (Drawing)</div>'+S.drw.map(img).join(''):''}</div>
 ${i.defects.map(d=>`<div class=card style="border-left:4px solid var(--r)"><b>${esc(d.number)}</b> <span class=chip>${d.status}</span><div>${esc(d.description)}</div>${d.correction_note?`<div class=m>แก้ไข: ${esc(d.correction_note)}</div>`:''}${S.media.filter(m=>m.defect_id===d.id).map(img).join('')}${ext()&&d.status==='OPEN'&&i.status==='CORRECTION_REQUIRED'?`${cam(`daf.bind(0,'${d.id}','${d.item_id}')`,'รูปหลังแก้ไข')}<textarea id="c_${d.id}" placeholder="อธิบายการแก้ไข"></textarea><button onclick="corr('${d.id}')">ส่งการแก้ไข</button>`:''}${isIns()&&d.correction_note?`<button class=s onclick="tokb('${d.id}')">📚 เก็บเข้าคลังความรู้</button>`:''}</div>`).join('')}
 ${i.items.map((t,n)=>`<div class=card><b>${n+1}. ${esc(t.name)}</b><div class=m>${esc(t.model)}${(f.fields||[]).map(x=>' · '+esc(x.l)+' '+esc((t.extra||{})[x.k]||'-')).join('')}${hq(f)?' · จำนวน '+(t.qty??1):''}${t.note?' · '+esc(t.note):''}</div><div>${S.media.filter(m=>m.item_id===t.id&&m.category!=='DEFECT_AFTER').map(img).join('')}</div>${edit?cam(`ipho.bind(0,'${t.id}')`,'เพิ่มรูปตรวจ'):''}${f.cl.map(c=>{const x=r.find(q=>q.item_id===t.id&&q.checklist_id===c.id)||{};return`<div style="border-top:1px solid #eee;padding:6px 0">${esc(c.label)}${c.review?' <span class=chip>SOURCE_REVIEW_REQUIRED</span>':''}${edit?`<div class=g><button class="${x.result==='PASS'?'':'s'}" onclick="setR('${t.id}','${c.id}','PASS')">ผ่าน</button><button class="${x.result==='FAIL'?'d':'s'}" onclick="setR('${t.id}','${c.id}','FAIL')">ไม่ผ่าน</button></div>${x.result==='FAIL'?`<textarea placeholder="เหตุผล (จำเป็น)" onchange="cm('${t.id}','${c.id}',this.value)">${esc(x.comment)}</textarea>`:''}`:` <span class="chip ${x.result==='FAIL'?'f':x.result?'o':''}">${x.result==='PASS'?'ผ่าน':x.result==='FAIL'?'ไม่ผ่าน':'-'}</span> ${esc(x.comment)}`}</div>`}).join('')}</div>`).join('')}
 ${A.map(a=>`<button class="${a[2]}" onclick="act('${a[0]}')">${a[1]}</button>`).join('')}
 <div class=card><b>ประวัติ</b>${S.sg.map(s=>`<div class=m>${SGN[s.action]||esc(String(s.action).slice(0,60))} · ${new Date(s.signed_at).toLocaleString('th-TH')}</div>`).join('')||'<div class=m>-</div>'}</div>`};
V.docs=()=>{const g={};S.docs.forEach(d=>{const p=d.inspections?.projects||d.inspections?.project;(g[p?.code||'-']=g[p?.code||'-']||[]).push(d)});
 return Object.keys(g).map(k=>`<h3>${esc(k)}</h3>`+g[k].map(d=>{const fo=d.inspections?.form_versions?.forms||(d.inspections&&fm(d.inspections));return`<div class=card><b>${esc(d.document_number)}</b> <span class="chip ${d.status==='APPROVED'?'o':'w'}">${DS[d.status]||d.status}</span><div class=m>${esc(fo?.name||'')} · Attempt ${d.inspections?.attempt||1}</div>${d.storage_path?`<div class=g><button onclick="dl('${d.storage_path}')">ดาวน์โหลด</button><button class=s onclick="sh('${d.storage_path}')">แชร์ (Line/อีเมล)</button></div>`:'<div class=m>ยังไม่มีไฟล์ PDF (DEMO: ดาวน์โหลดทันทีหลังอนุมัติ)</div>'}</div>`}).join('')).join('')||'<div class="card m">ยังไม่มีเอกสาร</div>'};
const sUrl=(p,dn)=>sb.storage.from('documents').createSignedUrl(p,dn?300:604800,dn?{download:true}:undefined).then(r=>{if(r.error)throw r.error;return r.data.signedUrl});
window.dl=p=>run(async()=>{location.href=await sUrl(p,1)});
window.sh=p=>run(async()=>{const u=await sUrl(p);navigator.share?await navigator.share({title:'เอกสาร QC',url:u}):(await navigator.clipboard.writeText(u),toast('คัดลอกลิงก์แล้ว (ใช้ได้ 7 วัน)'))});
V.kb=()=>S.kb.map(k=>`<div class=card><b>${esc(k.title)}</b> <span class=chip>${esc(k.category||'')}</span><div>อาการ: ${esc(k.symptom)}</div><div>การแก้ไข: ${esc(k.correction||'-')}</div></div>`).join('')||'<div class="card m">ยังไม่มีเรื่องในคลังความรู้</div>';
window.tokb=id=>DEMO?toast('DEMO ไม่รองรับ'):run(async()=>{const d=S.cur.defects.find(x=>x.id===id),{error}=await sb.from('knowledge_items').insert({title:d.number,category:fm(S.cur).code,symptom:d.description,correction:d.correction_note,defect_id:id,published:true,created_by:S.user.id});if(error)throw error},'เพิ่มเข้าคลังความรู้แล้ว');
V.notif=()=>S.nt.map(n=>`<div class=card onclick="${n.inspection_id?`open_('${n.inspection_id}')`:''}" style="${n.read?'':'border-left:4px solid var(--b)'}">${esc(n.message)}<div class=m>${new Date(n.created_at).toLocaleString('th-TH')}</div></div>`).join('')||'<div class="card m">ไม่มีการแจ้งเตือน</div>';
V.set=()=>`<div class=card><b>โปรไฟล์</b><input id=fn value="${esc(S.prof?.full_name||'')}" placeholder="ชื่อ-สกุล"><div class=m>บทบาท: ${RL[S.role]}</div><button onclick="svp()">บันทึกโปรไฟล์</button><button class=d onclick="logout()">ออกจากระบบ</button></div><div class="card m">จัดการโครงการ/แบบฟอร์ม/ผู้ใช้: ใช้ Supabase Table Editor (หน้า Admin ในแอปอยู่ในแผนถัดไป)</div>`;
window.svp=()=>run(async()=>{if(!DEMO){const{error}=await sb.from('profiles').update({full_name:$('#fn').value}).eq('id',S.user.id);if(error)throw error}},'บันทึกแล้ว');
// ----- actions -----
window.open_=async id=>{S.cur=S.list.find(i=>i.id===id);if(!S.cur)return toast('ไม่พบรายการ');await run(async()=>{[S.res,S.media,S.drw,S.sg]=await Promise.all([api.res(id),api.media(id),api.drawings(id),api.sigs(id)])});S.view='detail';render()};
window.act=async k=>{const i=S.cur;let r,sg=null;
 if(k==='pdf')return void await run(async()=>{toast('กำลังสร้าง PDF…');dlb(await buildPdf(i.id,await api.docOf(i.id)))});
 if(k==='start')r=await run(()=>api.rpc('start_inspection',{p_id:i.id}),'เริ่มตรวจแล้ว');
 else if(k==='re')r=await run(()=>api.rpc('resubmit_inspection',{p_id:i.id}),'แจ้งตรวจซ้ำแล้ว');
 else{let c=null;if(k==='no'){c=prompt('เหตุผลที่ไม่อนุมัติ (จำเป็น)');if(!c)return}else{sg=await sign();if(!sg)return}
  r=await run(()=>api.rpc(k==='fin'?'finalize_inspection':'approve_inspection',k==='fin'?{p_id:i.id,p_sig:sg}:{p_id:i.id,p_ok:k==='ok',p_comment:c,p_sig:sg}),'บันทึกแล้ว');
  if(r&&DEMO&&sg){(D.sg=D.sg||[]).push({inspection_id:i.id,action:k==='fin'?'INSPECTED':'APPROVED',image:sg,signed_at:new Date().toISOString()});dsave()}
  if(r&&(k==='ok'||k==='fin'))await run(async()=>{const n=(await api.list()).find(x=>x.id===i.id);if(k==='ok'||n.status==='CORRECTION_REQUIRED'){toast('กำลังสร้างเอกสาร PDF…');await finishDoc(n)}},'สร้างเอกสาร PDF แล้ว')}
 if(r)go('list')};
go=async function(v){S.view=v;if(!['new','set'].includes(v))await run(async()=>{S.list=await api.list();if(v==='docs')S.docs=await api.docs();if(v==='kb')S.kb=await api.kb()});
 await run(async()=>{S.nt=await api.notifs();if(v==='notif'&&!DEMO&&S.nt.some(n=>!n.read))await sb.from('notifications').update({read:true}).eq('read',false)});render()};window.go=go;
function rt(){if(DEMO||S.ch)return;S.ch=sb.channel('nt').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},p=>{toast('🔔 '+p.new.message);S.nt=[p.new,...S.nt];render()}).subscribe()}

(async()=>{if(!DEMO){const{data}=await sb.auth.getSession();if(data.session)return boot(data.session.user)}render()})();
</script></body></html>
