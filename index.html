<style>
:root{--bg:#f2f6f3;--c:#fff;--t:#10201a;--m:#5f6f67;--b:#dfe8e2;--p:#185b38;--p2:#e4f1ea;--a:#e78623;--r:16px;--sh:0 1px 2px #10201a0a,0 6px 18px #10201a0d;--nw:252px}
[data-theme=dark]{--bg:#0c1511;--c:#13201a;--t:#e6f0ea;--m:#93a79c;--b:#233a2f;--p:#4cc388;--p2:#15301f;--a:#f59e42;--sh:0 1px 2px #0006}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 var(--ff);background:var(--bg);color:var(--t)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--c);border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:8px;align-items:center;padding:4px 10px 16px;font-size:var(--fs-lead)}.brand img{width:34px}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:var(--t);text-decoration:none;margin-bottom:2px}
nav a.on{background:var(--p2);color:var(--p);font-weight:700}
main{padding:18px;max-width:1080px;width:100%;margin:auto;padding-bottom:96px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.bell{position:relative;text-decoration:none;font-size:22px}.bell i{position:absolute;top:-4px;right:-8px;background:#dc2626;color:#fff;font:700 var(--fs-micro)/1 var(--ff);padding:3px 5px;border-radius:9px}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:4px 0 12px;font-size:var(--fs-subtitle)}h3{margin:0 0 10px;font-size:var(--fs-body)}.m{color:var(--m);font-size:var(--fs-small)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--t)}.kpi b{display:block;font-size:var(--fs-headline)}
.pill{color:#fff;border-radius:20px;padding:2px 10px;font-size:var(--fs-caption);white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:var(--fs-small)}.bar>span:first-child{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar>div{flex:1;background:var(--b);border-radius:6px;height:14px;display:flex;overflow:hidden}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:3px 0 8px}
label{font-size:var(--fs-small);color:var(--m)}
.b{border:1px solid var(--b);background:var(--c);color:var(--t);padding:10px 14px;border-radius:10px;font:600 var(--fs-callout) var(--ff);cursor:pointer}.b.p{background:var(--p);color:#fff;border-color:var(--p)}.b.d{background:#dc2626;color:#fff;border-color:#dc2626}.b.on{background:var(--p2);border-color:var(--p);color:var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--b)}.steps i.on{background:var(--p)}
.fc{display:block;width:100%;text-align:left;margin-bottom:8px}.fc small{color:var(--m);font-weight:400}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ph img,.add{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--b)}.add{background:var(--p2);color:var(--p);font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ck{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--b)}.ck>div{display:flex;gap:6px}
.pf{padding:8px 12px;border-radius:9px;border:1px solid var(--b);background:var(--c);color:var(--t);font:600 var(--fs-small) var(--ff)}.pf.ok{background:#15803d;color:#fff}.pf.no{background:#dc2626;color:#fff}
.fl{display:flex;gap:6px}.fl select{width:100px}
.pad{width:100%;height:140px;border:2px dashed var(--m);border-radius:12px;background:#fff;touch-action:none}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.mb{background:var(--c);border-radius:var(--r);padding:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:99}
.li{display:block;text-decoration:none;color:var(--t)}.li .m{display:flex;gap:8px;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs .b{white-space:nowrap}
.warn{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:10px;margin-bottom:12px}
.entry{max-width:440px;margin:6vh auto;padding:16px}.entry img{width:84px;display:block;margin:auto}
.pg{background:#fff;color:#111;font:12px/1.35 Inter,'LINE Seed Sans TH',sans-serif;font-variant-numeric:tabular-nums;padding:26px 34px;display:flex;flex-direction:column;overflow:hidden}
.pg .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0b7a3e;padding-bottom:8px;margin-bottom:8px}.pg .hd img{width:58px}.pg .hd>div{flex:1;text-align:center}.pg .hd b{font-size:19px;display:block}.pg .tt{font-size:16px;font-weight:700;display:block;margin-top:2px}
.pg .bx{border:.5px solid #777;padding:4px 10px;font-size:11px;font-weight:400}.pg table{width:100%;border-collapse:collapse;table-layout:fixed;margin:6px 0}
.pg th,.pg td{border:.5px solid #777;padding:3px 4px;text-align:center;font-size:10.5px;word-break:break-word}.pg th{background:#e8f5ee;font-weight:600}.pg td.l{text-align:left}.pg td{height:40px}.pg td.x{color:#c00;font-weight:700}.pg td.ok{color:#0a7a3d;font-weight:700}.pg td.na{color:#888;font-size:9px}.pg td.ob{color:#b45309;font-weight:700}
.pg .sgs{display:flex;gap:30px;margin-top:12px}.pg .sg{flex:1;text-align:center;font-size:12px}.pg .si{height:60px;border-bottom:.5px solid #777;margin:4px 24px}.pg .si img{max-height:58px;max-width:100%}
.pg .bd{flex:1;min-height:0;display:flex;flex-direction:column}.pg .ft{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;font-size:10px;color:#444}
.pg .eg{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}.pg .eg>div{display:flex;flex-direction:column;min-height:0}.pg .eg h4{margin:0 0 4px;font-size:12px;background:#e8f5ee;padding:3px 6px}
.pg .im{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}.pg .im>div{position:relative;min-height:0;min-width:0;overflow:hidden;border:.5px solid #aaa;background:#fafafa}.pg .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pg .im.fx{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;flex:1;min-height:0}.pg .im.fx>div{flex:0 0 auto;width:150px;height:150px;position:relative;overflow:hidden;border:.5px solid #aaa;background:#fafafa}.pg .im.dw{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}.pg .im.dw>div{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:.5px solid #aaa;background:#fafafa}.pg .im.dw img{position:static;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.ph.lg img{width:118px;height:118px}

[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:block}
nav{position:fixed;left:0;top:0;bottom:0;width:var(--nw);height:auto;z-index:60;display:flex;flex-direction:column;padding:14px 12px;border-right:1px solid var(--b);transition:width .25s,transform .28s;overflow:hidden}
.brand{padding:4px 6px 14px;min-height:64px;justify-content:center}.brand .lk{width:100%;max-width:190px}.brand .ik{display:none;width:40px}
nav a{position:relative;font-weight:500;padding:12px;border-radius:12px;transition:.15s;white-space:nowrap}nav a:hover{background:var(--p2)}nav a.on{background:var(--p);color:#fff;font-weight:700;box-shadow:0 4px 12px #185b3855}
.nu{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 0 0;border-top:1px solid var(--b)}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.nu small{display:block;color:var(--m);font-size:var(--fs-caption)}.nu>div:not(.av){min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell{margin-left:var(--nw);transition:margin .25s;min-height:100vh}
.app.cl{--nw:78px}.app.cl nav a span,.app.cl .nu>div:not(.av),.app.cl .brand .lk,.app.cl .nu .ic{display:none}.app.cl .brand .ik{display:block}.app.cl nav a{justify-content:center}
.tb{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}.tb .ttl{font-size:var(--fs-lead);flex:1;margin-left:6px}
.ic{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--t);cursor:pointer;transition:.15s;flex:none}.ic:hover{background:var(--p2)}.ic i{position:absolute;top:4px;right:3px;background:#dc2626;color:#fff;font:700 var(--fs-micro)/1 var(--ff);padding:3px 5px;border-radius:9px;font-style:normal}
.chip{font-size:var(--fs-caption);padding:3px 10px;border-radius:20px;background:var(--p2);color:var(--p);font-weight:600}
main{max-width:1120px;padding:18px 20px 90px}
.scrim,.bb{display:none}
.pgin{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes gw{from{transform:scaleX(0)}}@keyframes sp{to{transform:rotate(360deg)}}
.card{box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #10201a1a}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:.15s}.b:active,.pf:active{transform:scale(.96)}.b.p{background:linear-gradient(135deg,var(--p),#22844f);box-shadow:0 4px 12px #185b3840}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.pf{min-width:78px;min-height:42px;border-radius:12px}

/* ============ TYPOGRAPHY SYSTEM ============
 Fonts: Inter (Latin + numerals) + LINE Seed Sans TH (Thai) - same weights/metrics family, no clash.
 Scale: modular, ratio = golden^(1/5) = 1.101 from 16px (headline = 16 x 1.618).
 Line-height: body 1.618 (golden); headings 1.35 (Thai tone marks need room).
 Weights: 400 body / 500 nav / 600 label / 700 heading (Thai maps 500->400, 600->700). Thai tracking stays 0. */
:root{
 --ff:'Inter','LINE Seed Sans TH',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 --fs-micro:10.9px;--fs-caption:12px;--fs-small:13.2px;--fs-callout:14.5px;--fs-body:16px;
 --fs-lead:17.6px;--fs-subtitle:19.4px;--fs-title:23.5px;--fs-headline:25.9px;--fs-display:28.5px;
 --lh-body:1.618;--lh-snug:1.45;--lh-head:1.35;
 --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
}
html{font-family:var(--ff);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--ff);font-size:var(--fs-body);font-weight:var(--fw-regular);line-height:var(--lh-body);letter-spacing:0;font-kerning:normal;font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{text-wrap:balance}p,.m{text-wrap:pretty}
h2{font-size:var(--fs-title);font-weight:var(--fw-bold);line-height:var(--lh-head);letter-spacing:0;margin:6px 0 14px}
h3{font-size:var(--fs-lead);font-weight:var(--fw-bold);line-height:var(--lh-head);letter-spacing:0;margin:0 0 10px}
.hero h2{font-size:var(--fs-display);line-height:1.3}
.brand{font-size:var(--fs-lead);font-weight:var(--fw-bold);line-height:1.3}
.tb .ttl{font-size:var(--fs-lead);font-weight:var(--fw-bold);line-height:1.3}
.m,.nu small,.kbg figcaption{font-size:var(--fs-callout);font-weight:var(--fw-regular);line-height:var(--lh-snug)}
label{font-size:var(--fs-small);font-weight:var(--fw-semibold);line-height:1.45;letter-spacing:0}
input,select,textarea{font-size:var(--fs-body);font-weight:var(--fw-regular);line-height:1.4}
nav a{font-size:var(--fs-callout);font-weight:var(--fw-medium);line-height:1.35}nav a.on{font-weight:var(--fw-bold)}
.b,.pf,.chp,.fe-chip{font-weight:var(--fw-semibold);line-height:1.3;letter-spacing:0}
.b{font-size:var(--fs-callout)}.b.sm,.tl .b,.pf,.chp,.fe-chip{font-size:var(--fs-small)}
.pill,.chip,.dfreq{font-size:var(--fs-caption);font-weight:var(--fw-semibold);line-height:1.3}
.kpi b{font-size:var(--fs-headline);font-weight:var(--fw-bold);line-height:1.15;letter-spacing:-.02em}
.dt{font-size:var(--fs-small);line-height:1.45}.dt th{font-size:var(--fs-caption);font-weight:var(--fw-bold);letter-spacing:0}
.stp>div,.tm,.tn,.acs,.srt{font-size:var(--fs-caption)}
.bb a{font-size:var(--fs-micro);font-weight:var(--fw-medium);line-height:1.3}.bb a.on{font-weight:var(--fw-bold)}
.bell i,.ic i,.bb a i,.badge,.cnt,.tsel small,.tg .add small{font-weight:var(--fw-bold);letter-spacing:0}
.pt small,.tsel small{line-height:1.35}
.kpi b,.dt td,.dt th,.pill,.chip,.cnt,.badge,.cd,.fi .cd,.fe-n,.stp i,.tm,.tn,input[type=number],input[type=date],input[type=time]{font-variant-numeric:tabular-nums}
.req{font-weight:var(--fw-bold)}.entry code,code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.9em}
.pg table{font-variant-numeric:tabular-nums}
@media(max-width:860px){h2{font-size:var(--fs-subtitle)}.hero h2{font-size:var(--fs-headline)}.kpi b{font-size:var(--fs-title)}body{font-size:var(--fs-body)}}


/* ===== v8: Modern UI — glass · bento · mobile-first (ต่อยอดจาก v7 ไม่รื้อของเดิม) ===== */
:root{--gl:rgba(255,255,255,.74);--gl2:rgba(255,255,255,.9);--glb:rgba(255,255,255,.6);--ln:#e1e9e4;--onp:#fff;--bad:#dc2626;--ok:#15803d;--wn:#b45309;--r:16px;--sh:0 1px 2px #10201a0a,0 8px 24px -8px #10201a1f;--shl:0 2px 6px #10201a10,0 20px 44px -14px #10201a40;--ease:cubic-bezier(.2,.8,.2,1);--bbh:64px}
[data-theme=dark]{--gl:rgba(23,34,28,.74);--gl2:rgba(23,34,28,.92);--glb:rgba(255,255,255,.07);--ln:#27382f;--onp:#06130c;--sh:0 1px 2px #0006,0 8px 24px -8px #0008;--shl:0 2px 6px #0006,0 20px 44px -14px #000a}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 105% -8%,color-mix(in srgb,var(--p) 13%,transparent),transparent 60%),radial-gradient(700px 420px at -8% 6%,color-mix(in srgb,var(--a) 9%,transparent),transparent 60%)}
#ldb{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,transparent,var(--p),var(--a),transparent) no-repeat;background-size:40% 100%;animation:ldb 1.1s linear infinite}#ldb.on{opacity:1}
@keyframes ldb{from{background-position:-40% 0}to{background-position:140% 0}}

/* ---- glass surfaces (เฉพาะจุดที่ควรมี: แถบบน · เมนู · แถบล่าง · แถบสรุป · ป๊อปอัป) ---- */
.tb{background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid var(--glb)}
nav{background:var(--gl2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid var(--ln)}
nav a{border-radius:12px;position:relative}
nav a.on{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 62%,#22c55e));color:var(--onp);font-weight:700;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--p) 70%,transparent)}
.sab{background:var(--gl);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid var(--glb);box-shadow:0 -12px 32px -14px #10201a40}
.pop{background:var(--gl2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glb);box-shadow:var(--shl);border-radius:18px}
.ov{background:rgba(8,16,12,.46);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mb{border:1px solid var(--glb);box-shadow:var(--shl);border-radius:20px}
.toast{border-radius:14px;box-shadow:var(--shl);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.entry .card{background:var(--gl2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shl);border-color:var(--glb)}

/* ---- cards · buttons · inputs ---- */
.card,.rl,.kpi{border-radius:var(--r);border:1px solid var(--ln);box-shadow:var(--sh)}
a.card:hover,a.kpi:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--p) 45%,var(--ln));box-shadow:var(--shl)}
.b{border-radius:12px;border:1px solid var(--ln);box-shadow:0 1px 2px #10201a0a;transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s,color .2s}
.b:hover{box-shadow:var(--sh)}
.b.p,.b.p:hover{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 64%,#22c55e));color:var(--onp);border-color:transparent;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--p) 75%,transparent)}
.b.d{box-shadow:0 8px 18px -8px #dc262699}
input,select,textarea{border-radius:12px;border-color:var(--ln);background:color-mix(in srgb,var(--c) 94%,var(--bg))}
.pill{background:color-mix(in srgb,var(--pc,#64748b) 14%,transparent);color:var(--pc,#64748b);border:1px solid color-mix(in srgb,var(--pc,#64748b) 30%,transparent);font-weight:700}
[data-theme=dark] .pill{color:color-mix(in srgb,var(--pc,#94a3b8) 55%,#fff)}
.chip{border:1px solid color-mix(in srgb,var(--p) 22%,transparent)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:36px;color:var(--m);text-decoration:none;font-weight:600;font-size:var(--fs-small)}.back:hover{color:var(--p)}

/* ---- tabs เป็น segmented pills เลื่อนได้ ---- */
.tabs{gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;margin:0 -2px 8px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs .b{flex:none;min-height:40px;border-radius:999px;padding:6px 15px;font-size:var(--fs-small)}
.tabs .b.on{background:var(--p);color:var(--onp);border-color:var(--p);box-shadow:0 6px 14px -6px color-mix(in srgb,var(--p) 80%,transparent)}
.vsw{border-radius:14px;background:color-mix(in srgb,var(--c) 80%,var(--bg))}

/* ---- หน้าหลัก: hero + bento ---- */
.hero{padding:18px 20px;margin-bottom:14px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,var(--c)),color-mix(in srgb,var(--a) 9%,var(--c)));border:1px solid var(--glb);box-shadow:var(--sh)}
.hero h2{margin:0}
.pjp{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.pjp label{flex:none;margin:0}.pjp select{margin:0;flex:1}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:14px 16px;font-size:var(--fs-small);color:var(--m)}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:72px;height:72px;border-radius:50%;background:var(--p);opacity:.07}
.kpi b{font-size:var(--fs-display);color:var(--t)}
.bar>div{height:10px;border-radius:99px}.bar i{border-radius:99px}
.tk{border-radius:14px}.tk:hover{box-shadow:var(--sh)}
.prg{height:6px;border-radius:99px}.prg i{border-radius:99px;background:linear-gradient(90deg,var(--p),color-mix(in srgb,var(--p) 60%,#22c55e))}

/* ---- ตัวกรอง/รายการ ---- */
.flt .sbar{min-height:46px}
.sbar{border-radius:14px;background:color-mix(in srgb,var(--c) 92%,var(--bg))}
.bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.bulk>*{flex:none}.bulk .ctl{margin-left:auto}
.rl>.tk,.rl>.rw,.rl>.dr,.rl>.rw2,.rl>.dcp{content-visibility:auto;contain-intrinsic-size:auto 76px}

/* ---- หน้าตรวจสอบ: หัวเอกสาร · การ์ดอุปกรณ์ · รายการตรวจ ---- */
.ih{background:linear-gradient(135deg,color-mix(in srgb,var(--p) 9%,var(--c)),var(--c) 60%)}
.ih-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ih-no{font-size:var(--fs-title);font-weight:700;letter-spacing:-.01em;line-height:1.25;word-break:break-all}
.ih-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.ih-act .b{flex:none;min-height:40px;padding:6px 13px;font-size:var(--fs-small)}
.mcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mc{font-size:var(--fs-caption);padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--p) 9%,transparent);color:var(--m);line-height:1.6}
.itc{padding:0;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 560px}
.itc-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:14px 16px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--p2) 75%,transparent),transparent)}
.itc-t{display:flex;gap:10px;align-items:flex-start;min-width:0}.itc-t b{font-size:var(--fs-lead);word-break:break-word}
.itc-n{flex:none;width:32px;height:32px;border-radius:10px;background:var(--p);color:var(--onp);display:grid;place-items:center;font-weight:700}
.itc-r{display:flex;gap:8px;align-items:center;flex:none}.itc-p.full{background:var(--ok);color:#fff}
details.sec{border-top:1px solid var(--ln);padding:0 16px 8px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;font-weight:600;font-size:var(--fs-callout);color:var(--m)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.cnt2{background:var(--p2);color:var(--p);border-radius:99px;padding:0 8px;font-size:var(--fs-caption);font-weight:700}
.cks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:0 28px;padding:0 16px;border-top:1px solid var(--ln)}
.cki{border-bottom:1px solid var(--ln)}.cki .ck{border-top:0;padding:10px 0}.cki .ck>span{font-weight:600}
.cki.fail{grid-column:1/-1;background:color-mix(in srgb,var(--bad) 6%,transparent);border-radius:14px;padding:0 12px;margin:6px 0;border-bottom:0}
.seg{display:flex;gap:6px;align-items:center}
.seg .pf{min-width:84px;min-height:44px;border-radius:12px;font-weight:700;transition:transform .15s var(--ease),background .15s}
.seg .pf.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 14px -6px #15803d99}
.seg .pf.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 6px 14px -6px #dc262699}
.seg select{width:auto;min-width:96px;min-height:44px;margin:0}
.itc-b{padding:6px 16px 12px}.itc-b input{margin:0}
.itc>details.tip{margin:6px 16px 16px}
.ph.lg img,.ph img,.add{border-radius:12px}

/* ---- ขั้นตอน (ส่งตรวจ) ---- */
.stp>div{position:relative}
.stp>div:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;border-radius:2px;background:var(--ln)}
.stp .dn:not(:last-child)::after{background:var(--a)}.stp .on:not(:last-child)::after{background:linear-gradient(90deg,var(--p),var(--ln))}
.fi{border-radius:0}.fi:hover{background:var(--p2)}

/* ---- เครื่องมือวาด/ไฮไลต์: แถบเครื่องมือเลื่อนแนวนอน ไม่กินพื้นที่รูป ---- */
.ed .tb2 .tl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.ed .tb2 .tl::-webkit-scrollbar{display:none}.ed .tb2 .tl>*{flex:none}
.ed .tb2{background:var(--gl2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* ---- มือถือ ---- */
@media(max-width:860px){
:root{--bbh:76px}
.bb{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));padding:6px 4px;border:1px solid var(--glb);border-radius:24px;background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shl)}
.bb a{isolation:isolate;min-height:48px;justify-content:center;transition:color .2s}
.bb a.on::before{content:"";position:absolute;top:2px;width:48px;height:30px;border-radius:15px;background:var(--p2);z-index:-1}
.bb .fab{margin-top:-30px}.bb .fab b{box-shadow:0 10px 22px -6px #e7862399}
.sab{left:10px;right:10px;bottom:calc(var(--bbh) + env(safe-area-inset-bottom));border-radius:18px;padding:10px 14px;border:1px solid var(--glb)}
.nb{bottom:calc(var(--bbh) + env(safe-area-inset-bottom))}
main{padding:12px 12px calc(var(--bbh) + 56px + env(safe-area-inset-bottom))}
.toast{bottom:calc(var(--bbh) + 24px + env(safe-area-inset-bottom))}
.mb::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--ln);margin:-6px auto 12px}
.flt{grid-template-columns:1fr 1fr}.flt .sbar{grid-column:1/-1}
.grid{grid-template-columns:repeat(2,1fr)}
.hero{padding:16px}
.ih-no{font-size:var(--fs-headline)}
.itc-h{padding:12px 14px 8px}details.sec{padding:0 14px 8px}.cks{padding:0 14px}.itc-b{padding:6px 14px 12px}.itc>details.tip{margin:6px 14px 14px}
.tg{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tg.ro{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch}.tg.ro .pt{flex:0 0 36vw;max-width:170px;scroll-snap-align:start}
.ph.lg{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.ph.lg img{flex:none;scroll-snap-align:start}
}
@media(max-width:600px){
.ck{flex-wrap:wrap}.ck>span{flex:1 1 100%}.seg{width:100%}.seg .pf,.seg select{flex:1}
.itc-r .pf{min-width:0;padding:8px 10px}
.ih-act .b{flex:1 1 calc(50% - 8px)}
.dbar{gap:6px}.dsel{width:100%}.dsel .b{flex:1}

async function dlJobs(jobs,zn){if(!jobs.length)return;const bz=busy('กำลังสร้างไฟล์...');let fail=0;try{
if(jobs.length==1){const b=await jobs[0].make();saveBlob(b,jobs[0].name);bz.x();toast('ดาวน์โหลดไฟล์แล้ว','ok');return}
try{bz.u('กำลังโหลดตัวบีบอัด ZIP...');await lib('zip')}catch(e){bz.x();toast('โหลดตัวบีบอัด ZIP ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');return}
const z=new JSZip(),used={};for(let n=0;n<jobs.length;n++){bz.u(`กำลังสร้างไฟล์ ${n+1}/${jobs.length}`);try{const b=await jobs[n].make(),o=jobs[n].name;let nm=o;if(used[o])nm=o.replace(/(\.pdf)?$/,'-'+used[o]+'.pdf');used[o]=(used[o]||0)+1;z.file(nm,b)}catch(e){fail++;console.error(e)}}
if(fail==jobs.length){bz.x();toast('สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง','er');return}
bz.u('กำลังบีบอัดเป็น ZIP...');const zb=await z.generateAsync({type:'blob'});saveBlob(zb,zn);bz.x();toast(`ดาวน์โหลด ZIP แล้ว (${jobs.length-fail} ไฟล์)${fail?` · สร้างไม่สำเร็จ ${fail} ไฟล์`:''}`,fail?'wn':'ok')}
catch(e){bz.x();toast('ดาวน์โหลดไม่สำเร็จ: '+thErr(e.message||e),'er')}finally{bz.x()}}
