<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART QC — ตรวจงานติดตั้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#1f6b3a;--o:#e8731a;--bg:#f3f5f2;--card:#fff;--ink:#1c2420;--mut:#66726b;--line:#d9dfda;--red:#c62828;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px}header small{opacity:.85}
main{max-width:860px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav a{flex:1;text-align:center;padding:10px 2px;font-size:12px;color:var(--mut);text-decoration:none;min-height:56px}
nav a.on{color:var(--g);font-weight:700;border-top:3px solid var(--o)}nav a span{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 12px}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 6px;font-size:17px}
button,.btn{font:inherit;min-height:46px;padding:8px 16px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--g)}button.red{background:var(--red);border-color:var(--red)}button.org{background:var(--o);border-color:var(--o)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:2px 0 8px}
label{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{border-left:5px solid var(--g);background:#fff;padding:10px 12px;border-radius:6px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{font-size:28px;display:block}.stat.w{border-left-color:var(--o)}.stat.r{border-left-color:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;background:#e5ebe7;color:var(--ink)}
.pill.WAITING_INSPECTION,.pill.WAITING_REINSPECTION,.pill.WAITING_APPROVAL{background:#fff1dd;color:#a35200}
.pill.CORRECTION_REQUIRED,.pill.REJECTED,.pill.major{background:#fde4e4;color:var(--red)}
.pill.APPROVED,.pill.closed{background:#dff3e3;color:var(--ok)}.pill.INSPECTING{background:#dfeaf8;color:#1b4f8f}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
.pf{display:flex;gap:8px}.pf button{flex:1}.pf .p.on{background:var(--ok);color:#fff;border-color:var(--ok)}.pf .f.on{background:var(--red);color:#fff;border-color:var(--red)}
.pf button:not(.on){background:#fff;color:var(--ink);border-color:var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.thumb{position:relative;width:92px;height:92px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#eee;cursor:pointer}
.thumb img,.thumb svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
.modal>div{background:#fff;border-radius:10px;padding:12px;width:100%;max-width:720px;max-height:96vh;overflow:auto}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tools button{min-height:40px;padding:4px 10px}.tools .on{background:var(--o);border-color:var(--o);color:#fff}
svg.ed{width:100%;touch-action:none;background:#222;border-radius:6px}
canvas.sig{width:100%;height:180px;border:1px dashed var(--mut);border-radius:8px;touch-action:none;background:#fff}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;display:none;max-width:90%}
.muted{color:var(--mut);font-size:14px}.hide{display:none}
.doc{background:#fff;padding:14mm;font-size:12px;line-height:1.4}.doc table{border-collapse:collapse;width:100%}.doc td,.doc th{border:1px solid #333;padding:4px 6px;vertical-align:top}
.doc .ph{width:80px;height:80px;object-fit:cover;margin:2px;border:1px solid #999}.doc .sg{height:50px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}.doc{padding:0}@page{size:A4;margin:12mm}.pg{counter-increment:pg}}
</style></head><body>
<header><div><b>SMART QC</b><br><small id="who"></small></div><button class="sec" id="lo" onclick="logout()" style="display:none;min-height:36px">ออกจากระบบ</button></header>
<main id="app">กำลังโหลด…</main><nav id="nav" style="display:none"></nav><div id="toast"></div>
<script>
// ===== ตั้งค่า: ใส่ค่าจาก Supabase > Project Settings > API (ใช้ anon key เท่านั้น) =====
const SUPABASE_URL='https://qrocqqsnrfvlqoimpgii.supabase.co', SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2NxcXNucmZ2bHFvaW1wZ2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDE1NjcsImV4cCI6MjEwNjg3NzU2N30.lIEeTabuUqHhBg--PCBkWWP5mHTD2dtdI5bMpij_GBM';
// =========================================================================================
const ST={DRAFT:'ร่าง',WAITING_INSPECTION:'รอตรวจ',INSPECTING:'กำลังตรวจ',CORRECTION_REQUIRED:'ต้องแก้ไข',WAITING_REINSPECTION:'รอตรวจซ้ำ',WAITING_APPROVAL:'รออนุมัติ',APPROVED:'อนุมัติแล้ว',REJECTED:'ไม่อนุมัติ'};
const RL={installer:'ผู้ผลิต/ผู้ติดตั้ง',inspector:'ผู้ตรวจสอบ',approver:'ผู้อนุมัติ',visitor:'ผู้เข้าชม',admin:'ผู้ดูแลระบบ'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,me=null,urlCache={};
const q=async p=>{const r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.t);t.t=setTimeout(()=>t.style.display='none',3500)}
const W=()=>['installer','inspector','approver','admin'].includes(me?.role),R=r=>me?.role===r||me?.role==='admin';
const fmt=d=>d?new Date(d).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'';
async function audit(action,entity,id,detail){await sb.from('audit_logs').insert({actor:me.id,action,entity,entity_id:String(id||''),detail:detail||null})}
async function notifyRole(role,message,link){const{data}=await sb.from('profiles').select('id').eq('role',role).eq('status','active');if(data?.length)await sb.from('notifications').insert(data.map(u=>({user_id:u.id,message,link})))}
async function url(path){if(urlCache[path])return urlCache[path];const{data}=await sb.storage.from('evidence').createSignedUrl(path,3600);return urlCache[path]=data?.signedUrl}
async function compress(file,max=1600){const bm=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
function pick(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>res(i.files[0]);i.click()})}

// ===== Auth =====
async function boot(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY){$('#app').innerHTML='<div class="card"><h2>ยังไม่ได้ตั้งค่า</h2>เปิดไฟล์นี้ แล้วใส่ <b>SUPABASE_URL</b> และ <b>SUPABASE_ANON_KEY</b> ที่ส่วนต้นของ &lt;script&gt;</div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT'){me=null;route()}});
  const{data:{session}}=await sb.auth.getSession();
  if(session)await loadMe();route();
}
async function loadMe(){const{data}=await sb.from('profiles').select('*').eq('id',(await sb.auth.getUser()).data.user.id).single();me=data}
function loginView(){
  $('#nav').style.display='none';$('#lo').style.display='none';$('#who').textContent='';
  $('#app').innerHTML=`<div class="card"><h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
  <label>อีเมล</label><input id="em" type="email" autocomplete="email"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="current-password">
  <label>ชื่อ-นามสกุล (เฉพาะสมัครใหม่)</label><input id="fn">
  <div class="row"><button onclick="signIn()">เข้าสู่ระบบ</button><button class="sec" onclick="signUp()">สมัครสมาชิก</button><button class="sec" onclick="google()">Google</button></div>
  <p class="muted">ผู้สมัครใหม่จะมีสถานะ "รออนุมัติ" จนกว่าผู้ดูแลระบบจะอนุมัติ</p></div>`}
async function signIn(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return toast('เข้าสู่ระบบไม่สำเร็จ: '+error.message);await loadMe();route()}
async function signUp(){const{error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value,options:{data:{full_name:$('#fn').value}}});if(error)return toast(error.message);toast('สมัครแล้ว (ถ้าเปิดยืนยันอีเมล ให้ตรวจอีเมลก่อน) แล้วรอผู้ดูแลอนุมัติ');await loadMe();route()}
async function google(){const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)toast(error.message)}
async function logout(){await sb.auth.signOut();location.hash='';}

// ===== Router =====
const NAV=[['dash','📊','ภาพรวม'],['inspections','📋','งานตรวจ'],['new','➕','ตรวจใหม่'],['defects','⚠️','Defect'],['docs','📄','เอกสาร'],['notifs','🔔','แจ้งเตือน'],['settings','⚙️','ตั้งค่า']];
async function route(){
  if(!sb)return;if(!me)return loginView();
  $('#who').textContent=`${me.full_name||me.email} · ${RL[me.role]}`;$('#lo').style.display='';
  if(me.status!=='active'){$('#nav').style.display='none';$('#app').innerHTML=`<div class="card"><h2>${me.status==='pending'?'รอผู้ดูแลระบบอนุมัติ':'บัญชีถูกระงับ'}</h2>กรุณาติดต่อผู้ดูแลระบบ</div>`;return}
  const[p,a]=(location.hash.slice(2)||'dash').split('/');
  const nav=NAV.slice();if(me.role==='admin')nav.push(['admin','🛠️','Admin']);
  $('#nav').style.display='flex';$('#nav').innerHTML=nav.map(n=>`<a href="#/${n[0]}" class="${n[0]===p||(p==='i'&&n[0]==='inspections')?'on':''}"><span>${n[1]}</span>${n[2]}</a>`).join('');
  $('#app').innerHTML='กำลังโหลด…';
  try{await({dash,inspections,new:newInsp,i:detail,defects,docs,notifs,settings,admin,projects}[p]||dash)(a)}catch(e){console.error(e);$('#app').innerHTML='<div class="card">เกิดข้อผิดพลาด: '+esc(e.message)+'</div>'}
}
window.addEventListener('hashchange',route);

// ===== Dashboard / Projects =====
async function dash(){
  const[ins,def,pr]=await Promise.all([q(sb.from('inspections').select('status')),q(sb.from('defects').select('severity,status')),q(sb.from('projects').select('id'))]);
  const c=s=>ins.filter(i=>i.status===s).length,od=def.filter(d=>d.status!=='closed');
  const S=(l,n,k='')=>`<div class="stat ${k}"><b>${n}</b>${l}</div>`;
  $('#app').innerHTML=`<h2>ภาพรวม</h2><div class="grid">${S('โครงการ',pr.length)}${S('งานตรวจทั้งหมด',ins.length)}${S('รอตรวจ',c('WAITING_INSPECTION'),'w')}${S('ต้องแก้ไข',c('CORRECTION_REQUIRED'),'r')}${S('รอตรวจซ้ำ',c('WAITING_REINSPECTION'),'w')}${S('รออนุมัติ',c('WAITING_APPROVAL'),'w')}${S('อนุมัติแล้ว',c('APPROVED'))}${S('Major ค้างอยู่',od.filter(d=>d.severity==='major').length,'r')}${S('Minor ค้างอยู่',od.filter(d=>d.severity==='minor').length,'w')}</div>
  <p><a href="#/projects">จัดการโครงการ →</a></p>`}
async function projects(){
  const pr=await q(sb.from('projects').select('*').order('code'));
  $('#app').innerHTML=`<h2>โครงการ</h2>`+pr.map(p=>`<div class="card"><h3>${esc(p.code)} ${esc(p.name)}</h3><span class="muted">${esc(p.client||'')}</span></div>`).join('')+(me.role==='admin'?'<p class="muted">เพิ่ม/แก้โครงการที่หน้า Admin</p>':'')}

// ===== Inspections list / new =====
async function inspections(){
  const d=await q(sb.from('inspections').select('id,doc_no,status,created_at,projects(code),equipment(code,name)').order('created_at',{ascending:false}).limit(100));
  $('#app').innerHTML=`<h2>งานตรวจ</h2>`+(d.map(i=>`<a href="#/i/${i.id}" style="text-decoration:none;color:inherit"><div class="card"><div class="row"><b>${esc(i.doc_no)}</b><span class="pill ${i.status}" style="flex:0">${ST[i.status]}</span></div><span class="muted">${esc(i.projects?.code)} · ${esc(i.equipment?.code||'-')} ${esc(i.equipment?.name||'')} · ${fmt(i.created_at)}</span></div></a>`).join('')||'<div class="card muted">ยังไม่มีงานตรวจ</div>')}
async function newInsp(){
  if(!W())return $('#app').innerHTML='<div class="card">บทบาทผู้เข้าชมสร้างงานตรวจไม่ได้</div>';
  const[pr,fm]=await Promise.all([q(sb.from('projects').select('*').eq('active',true).order('code')),q(sb.from('form_template_versions').select('id,version,equipment_fields,form_templates(code,name,active)').eq('status','published'))]);
  const forms=fm.filter(f=>f.form_templates.active);
  $('#app').innerHTML=`<h2>สร้างงานตรวจ</h2><div class="card">
  <label>1. โครงการ</label><select id="np" onchange="loadEq()">${pr.map(p=>`<option value="${p.id}">${esc(p.code)} ${esc(p.name)}</option>`).join('')}</select>
  <label>2. แบบฟอร์ม</label><select id="nf" onchange="eqFields()">${forms.map(f=>`<option value="${f.id}" data-f='${esc(JSON.stringify(f.equipment_fields))}'>${esc(f.form_templates.code)} ${esc(f.form_templates.name)}</option>`).join('')}</select>
  <label>3. อุปกรณ์</label><select id="ne" onchange="eqFill()"></select>
  <div id="eqf"></div>
  <button onclick="createInsp()" style="width:100%">เริ่มตรวจ</button></div>`;
  window._forms=forms;await loadEq();eqFields();
}
async function loadEq(){window._eq=await q(sb.from('equipment').select('*').eq('project_id',$('#np').value).order('code'));$('#ne').innerHTML='<option value="">➕ อุปกรณ์ใหม่</option>'+_eq.map(e=>`<option value="${e.id}">${esc(e.code)} ${esc(e.name||'')}</option>`).join('');eqFill()}
function eqFields(){const f=JSON.parse($('#nf').selectedOptions[0].dataset.f||'[]');
  $('#eqf').innerHTML=`<label>รหัสอุปกรณ์ (Code)</label><input id="e_code"><label>ชื่อ</label><input id="e_name"><label>Model</label><input id="e_model"><label>ตำแหน่ง (Position)</label><input id="e_pos"><label>รายละเอียด</label><input id="e_detail">`+f.filter(x=>!['model','pos','item'].includes(x.k)).map(x=>`<label>${esc(x.l)}</label><input data-x="${esc(x.k)}" data-l="${esc(x.l)}">`).join('');eqFill()}
function eqFill(){const e=_eq?.find(x=>x.id===$('#ne').value);const set=(i,v)=>{const el=$('#'+i);if(el){el.value=v||'';el.readOnly=!!e}};set('e_code',e?.code);set('e_name',e?.name);set('e_model',e?.model);set('e_pos',e?.position);set('e_detail',e?.detail)}
async function createInsp(){
  const pid=$('#np').value,vid=$('#nf').value;if(!pid||!vid)return toast('เลือกโครงการและแบบฟอร์ม');
  let eid=$('#ne').value;
  if(!eid){const code=$('#e_code').value.trim();if(!code)return toast('กรอกรหัสอุปกรณ์');
    const e=await q(sb.from('equipment').insert({project_id:pid,code,name:$('#e_name').value,model:$('#e_model').value,position:$('#e_pos').value,detail:$('#e_detail').value}).select().single());eid=e.id}
  const xd={};document.querySelectorAll('#eqf [data-x]').forEach(i=>{if(i.value)xd[i.dataset.l]=i.value});
  const v=_forms.find(f=>f.id===vid),pj=(await q(sb.from('projects').select('code').eq('id',pid).single())).code;
  const pre=`${v.form_templates.code}-${pj}-`;const{count}=await sb.from('inspections').select('id',{count:'exact',head:true}).like('doc_no',pre+'%');
  const doc_no=pre+String((count||0)+1).padStart(3,'0');
  const ins=await q(sb.from('inspections').insert({doc_no,project_id:pid,version_id:vid,equipment_id:eid,equipment_data:xd,created_by:me.id}).select().single());
  const items=await q(sb.from('checklist_items').select('*').eq('version_id',vid).order('sort'));
  await q(sb.from('inspection_items').insert(items.map(i=>({inspection_id:ins.id,checklist_item_id:i.id,sort:i.sort,title:i.title}))));
  await sb.from('equipment_history').insert({equipment_id:eid,inspection_id:ins.id,note:'ตรวจตาม '+doc_no,by:me.id});
  await audit('create_inspection','inspection',ins.id,{doc_no});location.hash='#/i/'+ins.id}

// ===== Inspection detail =====
async function detail(id){
  const[ins,items,defs,evs,sigs]=await Promise.all([
    q(sb.from('inspections').select('*,projects(code,name),equipment(*),form_template_versions(version,form_templates(code,name))').eq('id',id).single()),
    q(sb.from('inspection_items').select('*').eq('inspection_id',id).order('sort')),
    q(sb.from('defects').select('*,defect_corrections(*)').eq('inspection_id',id).order('created_at')),
    q(sb.from('evidence').select('*,evidence_annotations(shapes)').eq('inspection_id',id).order('at')),
    q(sb.from('signatures').select('*').eq('inspection_id',id).order('at'))]);
  window._cur={ins,items,defs,evs,sigs};
  const s=ins.status,edit=(s==='DRAFT'&&W())||(s==='INSPECTING'&&R('inspector'));
  const th=(e)=>`<div class="thumb" onclick="markup('${e.id}')"><img data-p="${esc(e.path)}" alt="">${e.evidence_annotations?.length?`<svg viewBox="0 0 ${e.evidence_annotations.at(-1).shapes.w} ${e.evidence_annotations.at(-1).shapes.h}" preserveAspectRatio="xMidYMid slice">${shapesSVG(e.evidence_annotations.at(-1).shapes.list)}</svg>`:''}</div>`;
  $('#app').innerHTML=`<a href="#/inspections">← กลับ</a><div class="card"><div class="row"><h2 style="margin:0">${esc(ins.doc_no)}</h2><span class="pill ${s}" style="flex:0">${ST[s]}</span></div>
  <div class="muted">${esc(ins.projects.code)} ${esc(ins.projects.name)}<br>${esc(ins.form_template_versions.form_templates.name)} (v${ins.form_template_versions.version})<br>อุปกรณ์: ${esc(ins.equipment?.code)} ${esc(ins.equipment?.name||'')} ${esc(ins.equipment?.model||'')} ${esc(ins.equipment?.position||'')}${Object.entries(ins.equipment_data||{}).map(([k,v])=>` · ${esc(k)}: ${esc(v)}`).join('')}</div></div>
  <div class="card"><h3>รายการตรวจ</h3>${items.map(it=>{const d=defs.find(d=>d.inspection_item_id===it.id);return`<div class="item"><b>${it.sort}. ${esc(it.title)}</b>
   ${edit?`<div class="pf"><button class="p ${it.result==='pass'?'on':''}" onclick="setRes('${it.id}','pass')">✓ ผ่าน</button><button class="f ${it.result==='fail'?'on':''}" onclick="setRes('${it.id}','fail')">✗ ไม่ผ่าน</button></div>
   <input placeholder="หมายเหตุ" value="${esc(it.remark)}" onchange="setRemark('${it.id}',this.value)">`:`<div>${it.result==='pass'?'<span class="pill APPROVED">ผ่าน</span>':it.result==='fail'?'<span class="pill major">ไม่ผ่าน</span>':'<span class="pill">ยังไม่ตรวจ</span>'} ${esc(it.remark||'')}</div>`}

function defectCard(d,ins,evs,items,th){

  <div class="muted">รูปหลังแก้ไข</div><div class="thumbs">${after.map(th).join('')}${canFix?`<button class="sec" onclick="addPhoto(null,'${d.id}')">📷 รูปหลังแก้ไข</button>`:''}</div>
  ${(d.defect_corrections||[]).sort((a,b)=>a.at<b.at?-1:1).map(c=>`<div class="muted">• ${c.kind==='correction'?'แก้ไข':'ตรวจซ้ำ'+(c.passed?' (ผ่าน)':' (ไม่ผ่าน)')}: ${esc(c.note||'')} · ${fmt(c.at)}</div>`).join('')}
  ${canFix?`<input id="cn${d.id}" placeholder="บันทึกการแก้ไข"><button class="org" onclick="correct('${d.id}')">บันทึกว่าแก้ไขแล้ว</button>`:''}
  ${canRe?`<input id="rn${d.id}" placeholder="หมายเหตุตรวจซ้ำ"><div class="pf"><button class="p on" onclick="reinspect('${d.id}',true)">ผ่าน</button><button class="f on" onclick="reinspect('${d.id}',false)">ไม่ผ่าน</button></div>`:''}</div>`}
function actions(ins,items,defs){

  const c=m.querySelector('#sg');c.width=c.clientWidth*2;c.height=360;const x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';let dr=false,dirty=false;

   await q(sb.from('signatures').insert({inspection_id:_cur.ins.id,signer:me.id,signer_name:me.full_name||me.email,role:me.role,purpose,image:img}));res(img)}})}

function shapesSVG(l){return l.map(s=>{const c=`stroke="${s.c}" stroke-width="${s.w}" fill="none" stroke-linecap="round"`;
  if(s.t==='pen')return`<polyline points="${s.p.map(p=>p.join(',')).join(' ')}" ${c}/>`;
  if(s.t==='line')return`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" ${c}/>`;
  if(s.t==='hl')return`<line x1="${s.a[0]}" y1="${s.a[1]}" x2="${s.b[0]}" y2="${s.b[1]}" stroke="#ffeb3b" stroke-opacity=".5" stroke-width="${s.w*6}" stroke-linecap="round"/>`;
  if(s.t==='circle'){const rx=Math.abs(s.b[0]-s.a[0])/2,ry=Math.abs(s.b[1]-s.a[1])/2;return`<ellipse cx="${(s.a[0]+s.b[0])/2}" cy="${(s.a[1]+s.b[1])/2}" rx="${rx}" ry="${ry}" ${c}/>`}
  if(s.t==='arrow'){const[x1,y1]=s.a,[x2,y2]=s.b,a=Math.atan2(y2-y1,x2-x1),L=s.w*5;return`<g ${c}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><polyline points="${x2-L*Math.cos(a-.5)},${y2-L*Math.sin(a-.5)} ${x2},${y2} ${x2-L*Math.cos(a+.5)},${y2-L*Math.sin(a+.5)}"/></g>`}
  if(s.t==='text')return`<text x="${s.a[0]}" y="${s.a[1]}" fill="${s.c}" font-size="${s.w*6}" font-weight="700" font-family="Sarabun,sans-serif">${esc(s.s)}</text>`;return''}).join('')}
async function markup(evId){

  <svg class="ed" viewBox="0 0 ${W_} ${H_}"><image href="${u}" width="${W_}" height="${H_}"/><g id="sh"></g></svg>
  <div class="row" style="margin-top:8px">${ro?'':'<button class="sec" id="mu">↶ ย้อน</button><button class="sec" id="mr">↷ ทำซ้ำ</button><button class="sec" id="mc2">ลบทั้งหมด</button><button id="ms">บันทึก</button>'}<button class="sec" id="mx">ปิด</button></div></div>`;
  document.body.append(m);const svg=m.querySelector('svg'),g=m.querySelector('#sh'),draw=()=>g.innerHTML=shapesSVG(cur?[...list,cur]:list);draw();
  const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return[Math.round(r.x),Math.round(r.y)]};

  <tr><td colspan="2">อุปกรณ์: ${esc(I.equipment?.code)} ${esc(I.equipment?.name||'')} ${esc(I.equipment?.model||'')} ${esc(I.equipment?.position||'')} ${Object.entries(I.equipment_data||{}).map(([k,x])=>esc(k)+': '+esc(x)).join(' · ')}</td></tr></table><br>
  <table><tr><th>#</th><th>รายการ</th><th>ผลตรวจ</th><th>หมายเหตุ</th><th>รูปภาพ</th></tr>${rows.join('')}</table>
  ${s.defs.length?`<br><b>Defect (FR-INS-ME-004)</b><table><tr><th>#</th><th>รายละเอียด</th><th>ก่อนแก้ไข</th><th>หลังแก้ไข</th><th>การแก้ไข</th></tr>${drows.join('')}</table>`:''}
  <br><table style="text-align:center"><tr><th>ผู้แก้ไข (ผู้ผลิต/ติดตั้ง)</th><th>ผู้ตรวจสอบ</th><th>ผู้อนุมัติ</th></tr><tr><td>${sg('installer')}</td><td>${sg('inspector')}</td><td>${sg('approver')}</td></tr></table>
  <p style="text-align:right">${esc(fm.code)} · หน้า 1/1 (พิมพ์แล้วเลขหน้าตามเบราว์เซอร์)</p></div>`}
async function notifs(){
  const n=await q(sb.from('notifications').select('*').eq('user_id',me.id).order('at',{ascending:false}).limit(50));
  $('#app').innerHTML=`<h2>แจ้งเตือน</h2>`+(n.map(x=>`<div class="card" style="${x.read?'opacity:.6':''}"><a href="${esc(x.link||'#/notifs')}" onclick="sb.from('notifications').update({read:true}).eq('id','${x.id}')">${esc(x.message)}</a><div class="muted">${fmt(x.at)}</div></div>`).join('')||'<div class="card muted">ไม่มีแจ้งเตือน</div>')}
async function settings(){$('#app').innerHTML=`<h2>ตั้งค่า</h2><div class="card"><b>${esc(me.full_name||'')}</b><br>${esc(me.email)}<br>บทบาท: ${RL[me.role]}<br><span class="muted">บทบาทเปลี่ยนได้โดยผู้ดูแลระบบเท่านั้น</span></div><div class="card"><a href="#/projects">โครงการทั้งหมด</a></div>`}

// ===== Admin =====
async function admin(tab='users'){
  if(me.role!=='admin')return $('#app').innerHTML='<div class="card">เฉพาะผู้ดูแลระบบ</div>';
  const T=['users:ผู้ใช้','projects:โครงการ','forms:แบบฟอร์ม','equipment:อุปกรณ์','audit:Audit Log'];
  const head=`<h2>Admin</h2><div class="row">${T.map(t=>`<button class="${t.split(':')[0]===tab?'':'sec'}" onclick="location.hash='#/admin/${t.split(':')[0]}'">${t.split(':')[1]}</button>`).join('')}</div><br>`;let h='';
  if(tab==='users'){const u=await q(sb.from('profiles').select('*').order('created_at',{ascending:false}));
    h=u.map(x=>`<div class="card"><b>${esc(x.full_name||'')}</b> <span class="muted">${esc(x.email)}</span><div class="row"><select onchange="adm('profiles','${x.id}',{role:this.value})">${Object.keys(RL).map(r=>`<option value="${r}" ${x.role===r?'selected':''}>${RL[r]}</option>`).join('')}</select><select onchange="adm('profiles','${x.id}',{status:this.value})">${['pending:รออนุมัติ','active:ใช้งาน','disabled:ระงับ'].map(s=>`<option value="${s.split(':')[0]}" ${x.status===s.split(':')[0]?'selected':''}>${s.split(':')[1]}</option>`).join('')}</select></div></div>`).join('')}
  if(tab==='projects'){const p=await q(sb.from('projects').select('*').order('code')),u=await q(sb.from('profiles').select('id,full_name,email').eq('status','active')),pm=await q(sb.from('project_members').select('*'));
    h=`<div class="card"><h3>เพิ่มโครงการ</h3><input id="pc" placeholder="รหัส เช่น PJ68/074"><input id="pn" placeholder="ชื่อโครงการ"><input id="pcl" placeholder="ลูกค้า/บริษัท"><button onclick="addProject()">เพิ่ม</button></div>`+p.map(x=>`<div class="card"><input value="${esc(x.name)}" onchange="adm('projects','${x.id}',{name:this.value})"><b>${esc(x.code)}</b> <label><input type="checkbox" style="width:auto;min-height:0" ${x.active?'checked':''} onchange="adm('projects','${x.id}',{active:this.checked})"> เปิดใช้งาน</label>
    <div class="muted">สมาชิก: ${pm.filter(m=>m.project_id===x.id).map(m=>esc(u.find(y=>y.id===m.user_id)?.full_name||'')+` <a href="#" onclick="delMember('${x.id}','${m.user_id}');return false">✕</a>`).join(', ')||'-'}</div>
    <select onchange="addMember('${x.id}',this.value)"><option value="">+ เพิ่มสมาชิก</option>${u.map(y=>`<option value="${y.id}">${esc(y.full_name||y.email)}</option>`).join('')}</select></div>`).join('')}
  if(tab==='forms'){const f=await q(sb.from('form_templates').select('*,form_template_versions(id,version,status,equipment_fields)').order('code'));
    h=`<div class="card"><h3>สร้างแบบฟอร์มใหม่</h3><input id="fc" placeholder="รหัส เช่น FR-INS-ME-009"><input id="fnm" placeholder="ชื่อแบบฟอร์ม"><label>ฟิลด์รายละเอียดอุปกรณ์เพิ่มเติม (คั่นด้วย ,)</label><input id="ff" placeholder="แรงม้า (hp), ยาว (m), จำนวน"><button onclick="addForm()">สร้าง (Draft v1)</button></div>`+f.map(x=>`<div class="card"><input value="${esc(x.name)}" onchange="adm('form_templates','${x.id}',{name:this.value})"><b>${esc(x.code)}</b> · ${x.form_template_versions.sort((a,b)=>a.version-b.version).map(v=>`<a href="#" onclick="editVer('${v.id}');return false">v${v.version} ${v.status}</a>`).join(' | ')}</div>`).join('')}
  if(tab==='equipment'){const e=await q(sb.from('equipment').select('*,projects(code)').order('code'));
    h=e.map(x=>`<div class="card"><b>${esc(x.projects?.code)} · ${esc(x.code)}</b><input value="${esc(x.name||'')}" placeholder="ชื่อ" onchange="adm('equipment','${x.id}',{name:this.value})"><div class="row"><input value="${esc(x.model||'')}" placeholder="Model" onchange="adm('equipment','${x.id}',{model:this.value})"><input value="${esc(x.position||'')}" placeholder="Position" onchange="adm('equipment','${x.id}',{position:this.value})"></div></div>`).join('')||'ไม่มีอุปกรณ์'}
  if(tab==='audit'){const a=await q(sb.from('audit_logs').select('*,profiles(full_name,email)').order('at',{ascending:false}).limit(100));h=a.map(x=>`<div class="card"><b>${esc(x.action)}</b> ${esc(x.entity||'')}<div class="muted">${esc(x.profiles?.full_name||x.profiles?.email||'')} · ${fmt(x.at)}</div></div>`).join('')}
  $('#app').innerHTML=head+h}
async function adm(t,id,v){await q(sb.from(t).update(v).eq('id',id));await audit('admin_update:'+t,t,id,v);toast('บันทึกแล้ว')}
async function addProject(){await q(sb.from('projects').insert({code:$('#pc').value,name:$('#pn').value,client:$('#pcl').value,created_by:me.id}));await audit('create_project','project',$('#pc').value);admin('projects')}
async function addMember(p,u){if(!u)return;await q(sb.from('project_members').insert({project_id:p,user_id:u}));admin('projects')}
async function delMember(p,u){await q(sb.from('project_members').delete().eq('project_id',p).eq('user_id',u));admin('projects')}
async function addForm(){const code=$('#fc').value.trim(),name=$('#fnm').value.trim();if(!code||!name)return toast('กรอกรหัสและชื่อ');
  const f=$('#ff').value.split(',').map(s=>s.trim()).filter(Boolean),fields=[{k:'item',l:'รายการ'},{k:'model',l:'รุ่น'},{k:'pos',l:'ตำแหน่ง'},...f.map((l,i)=>({k:'x'+i,l}))];
  const t=await q(sb.from('form_templates').insert({code,name}).select().single());const v=await q(sb.from('form_template_versions').insert({template_id:t.id,version:1,equipment_fields:fields}).select().single());await audit('create_form','form_template',t.id);editVer(v.id)}
async function editVer(id){
  const v=await q(sb.from('form_template_versions').select('*,form_templates(code,name)').eq('id',id).single()),it=await q(sb.from('checklist_items').select('*').eq('version_id',id).order('sort')),d=v.status==='draft';
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><h3>${esc(v.form_templates.code)} v${v.version} (${v.status})</h3>${d?'':'<p class="muted">Version ที่ publish แล้วแก้ไม่ได้ — กด "สร้าง Draft ใหม่" เพื่อแก้ (งานที่ตรวจไปแล้วไม่เปลี่ยน)</p>'}
  ${it.map((x,i)=>`<div class="row"><span style="flex:0">${i+1}</span><input value="${esc(x.title)}" ${d?'':'disabled'} onchange="adm('checklist_items','${x.id}',{title:this.value})">${d?`<button class="sec" onclick="mv('${id}','${x.id}',-1)">↑</button><button class="sec" onclick="mv('${id}','${x.id}',1)">↓</button><button class="red" onclick="delItem('${id}','${x.id}')">ลบ</button>`:''}</div>`).join('')}
  ${d?`<div class="row"><input id="ni" placeholder="หัวข้อตรวจใหม่"><button onclick="addItem('${id}',${it.length+1})">เพิ่ม</button></div><button class="org" style="width:100%" onclick="publish('${id}','${v.template_id}')">Publish Version นี้</button>`:`<button class="org" style="width:100%" onclick="newDraft('${id}')">สร้าง Draft ใหม่จาก v${v.version}</button>`}
  <button class="sec" style="width:100%;margin-top:6px" onclick="this.closest('.modal').remove();admin('forms')">ปิด</button></div>`;document.body.append(m)}
function reopen(id){document.querySelector('.modal')?.remove();editVer(id)}
async function addItem(v,n){const t=$('#ni').value.trim();if(!t)return;await q(sb.from('checklist_items').insert({version_id:v,sort:n,title:t}));reopen(v)}
async function delItem(v,id){await q(sb.from('checklist_items').delete().eq('id',id));reopen(v)}
async function mv(v,id,dir){const it=await q(sb.from('checklist_items').select('*').eq('version_id',v).order('sort')),i=it.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=it.length)return;
  const a=it[i],b=it[j];await q(sb.from('checklist_items').update({sort:-1}).eq('id',a.id));await q(sb.from('checklist_items').update({sort:a.sort}).eq('id',b.id));await q(sb.from('checklist_items').update({sort:b.sort}).eq('id',a.id));reopen(v)}
async function publish(v,t){if(!confirm('Publish แล้วจะแก้ Version นี้ไม่ได้ และ Version เดิมจะถูกเก็บถาวร'))return;
  await q(sb.from('form_template_versions').update({status:'archived'}).eq('template_id',t).eq('status','published'));await q(sb.from('form_template_versions').update({status:'published',published_at:new Date().toISOString()}).eq('id',v));await audit('publish_form','form_template_version',v);document.querySelector('.modal')?.remove();admin('forms')}
async function newDraft(v){const o=await q(sb.from('form_template_versions').select('*').eq('id',v).single()),all=await q(sb.from('form_template_versions').select('version,status').eq('template_id',o.template_id));
  if(all.some(x=>x.status==='draft'))return toast('มี Draft อยู่แล้ว');const items=await q(sb.from('checklist_items').select('*').eq('version_id',v).order('sort'));
  const n=await q(sb.from('form_template_versions').insert({template_id:o.template_id,version:Math.max(...all.map(x=>x.version))+1,equipment_fields:o.equipment_fields}).select().single());
  await q(sb.from('checklist_items').insert(items.map(i=>({version_id:n.id,sort:i.sort,title:i.title}))));reopen(n.id)}
boot();
</script></body></html>
