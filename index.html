.tg .pt img{width:100%;height:auto;aspect-ratio:1;object-fit:cover}.pt select{margin:0;padding:6px;font-size:12px}.pt select.un{border-color:var(--a);background:#fff7ed}[data-theme=dark] .pt select.un{background:#3a2610}.pt small{line-height:1.2}
.tg .add{width:100%;height:auto;aspect-ratio:1;text-align:center;font-size:26px}.tg .add small{font-size:11px;font-weight:600}
.toast{display:flex;align-items:center;gap:8px;max-width:92vw}.toast.ok{background:#15803d}.toast.wn{background:#b45309}.toast.er{background:#b91c1c}
.spin2{width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes cfa{to{transform:translate(var(--x),105vh) rotate(720deg)}}
.cel{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:#0008;animation:fi .2s}.cel>div{background:var(--c);border-radius:20px;padding:26px 34px;text-align:center;max-width:86vw;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.cok{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:#16a34a;color:#fff;font-size:42px;line-height:72px;animation:pop .6s}.cf{position:fixed;top:-14px;width:8px;height:12px;z-index:96;border-radius:2px;animation:cfa 1.8s ease-in forwards}
main.pgin>*{animation:fi .35s both}main.pgin>*:nth-child(2){animation-delay:.05s}main.pgin>*:nth-child(3){animation-delay:.1s}main.pgin>*:nth-child(4){animation-delay:.15s}main.pgin>*:nth-child(n+5){animation-delay:.2s}
.pg .cp{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;font-size:10px;padding:2px 5px;text-align:left;z-index:1}

const dHtml=()=>{const F=dFil();return (F.slice(0,DF.n).map(DF.tab=='doc'?docRow:kbRow).join('')||`<div class=empty>${DF.tab=='doc'?'ยังไม่มีเอกสารที่อนุมัติ':'คลังความรู้จะสะสมเมื่อผู้ติดตั้งบันทึกวิธีแก้ไข Defect'}</div>`)+(F.length>DF.n?`<button class=b style="width:100%;border:0;border-radius:0" onclick="DF.n+=20;dUp()">แสดงเพิ่ม (เหลืออีก ${F.length-DF.n})</button>`:'')};
function dUp(){$('#dl').innerHTML=dHtml();$('#dc').textContent=dFil().length;document.querySelectorAll('[data-dt]').forEach(b=>b.className='b '+(b.dataset.dt==DF.tab?'on':''))}
function docs(){const nd=S.inspections.filter(i=>i.status=='approved').length,nk=S.defects.filter(d=>d.fix_note).length;
return `<h2>เอกสาร</h2><div class=tabs><button class="b ${DF.tab=='doc'?'on':''}" data-dt=doc onclick="DF.tab='doc';DF.n=20;dUp()">เอกสารที่อนุมัติแล้ว (${nd})</button><button class="b ${DF.tab=='kb'?'on':''}" data-dt=kb onclick="DF.tab='kb';DF.n=20;dUp()">คลังความรู้ Defect (${nk})</button></div><div class=flt><div class=sbar>${ic('search')}<input placeholder="ค้นหา เลขที่เอกสาร / โครงการ / อุปกรณ์ / วิธีแก้ไข" value="${h(DF.q)}" oninput="DF.q=this.value;DF.n=20;dUp()" autocomplete=off></div><select onchange="DF.pj=this.value;DF.n=20;dUp()"><option value="">ทุกโครงการ</option>${myProj().map(p=>`<option value=${p.id} ${DF.pj==p.id?'selected':''}>${h(p.code)} ${h(p.name)}</option>`).join('')}</select><select onchange="DF.fm=this.value;DF.n=20;dUp()"><option value="">ทุกฟอร์ม</option>${forms().map(f=>`<option value=${f.code} ${DF.fm==f.code?'selected':''}>${h(f.s)}</option>`).join('')}</select></div><div class=m style="margin:0 2px 8px">พบ <b id=dc>${dFil().length}</b> รายการ</div><div class=rl id=dl>${dHtml()}</div>`}

function editForm(code){const f=S.form_templates.find(x=>x.code==code)||{code:'',title:'',short_name:'',extra_fields:[],checks:[],active:true};modal(`<h3>${code?'แก้ไข':'เพิ่ม'}ฟอร์มตรวจสอบ</h3><label>รหัสฟอร์ม (เช่น FR-INS-ME-029)</label><input id=fc value="${h(f.code)}" ${code?'disabled':''}><label>ชื่อฟอร์ม (แสดงหัวเอกสาร)</label><input id=ft value="${h(f.title)}"><label>ชื่อสั้น</label><input id=fs value="${h(f.short_name)}"><label>คอลัมน์รายละเอียดอุปกรณ์เพิ่มเติม</label><div class=row>${Object.entries(XF).map(([k,l])=>`<label><input type=checkbox class=fx value=${k} style="width:auto" ${f.extra_fields.some(e=>e.key==k)?'checked':''}> ${l}</label>`).join('')}</div><label>รายการตรวจสอบ (บรรทัดละ 1 รายการ · ลำดับ = ลำดับคอลัมน์)</label><textarea id=fk rows=8>${f.checks.map(c=>h(c.label)).join('\n')}</textarea><label><input type=checkbox id=fa style="width:auto" ${f.active!==false?'checked':''}> เปิดใช้งาน</label><div class=row><button class="b p" onclick="saveForm('${code}')">บันทึก</button>${code?`<button class="b d" onclick="delForm('${code}')">ลบ</button>`:''}</div>`)}
