/* ============ TYPOGRAPHY SYSTEM ============

const z=new JSZip(),used={};for(let n=0;n<jobs.length;n++){bz.u(`กำลังสร้างไฟล์ ${n+1}/${jobs.length}`);try{const b=await jobs[n].make(),o=jobs[n].name;let nm=o;if(used[o])nm=o.replace(/(\.pdf)?$/,'-'+used[o]+'.pdf');used[o]=(used[o]||0)+1;z.file(nm,b)}catch(e){fail++;console.error(e)}}
if(fail==jobs.length){bz.x();toast('สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง','er');return}
bz.u('กำลังบีบอัดเป็น ZIP...');const zb=await z.generateAsync({type:'blob'});saveBlob(zb,zn);bz.x();toast(`ดาวน์โหลด ZIP แล้ว (${jobs.length-fail} ไฟล์)${fail?` · สร้างไม่สำเร็จ ${fail} ไฟล์`:''}`,fail?'wn':'ok')}
catch(e){bz.x();toast('ดาวน์โหลดไม่สำเร็จ: '+thErr(e.message||e),'er')}finally{bz.x()}}

 const scan=()=>document.querySelectorAll('input,textarea').forEach(i=>{if(i.tagName=='INPUT'&&!OKT.includes(i.type||''))return;if(i.closest('.tin,.sg')||i.dataset.noclr!=null)return;prep(i);wrap(i);const w=i.closest('.clrw');if(w&&i._opts&&!w.querySelector('.tadn')){w.classList.add('dn');const b=document.createElement('button');b.type='button';b.className='tadn';b.textContent='▾';b.setAttribute('aria-label','แสดงรายการ');b.addEventListener('pointerdown',e=>e.preventDefault());b.addEventListener('click',()=>{tah.hidden?(i.focus(),tshow(i,true)):tah.hidden=true});w.appendChild(b)}if(w&&i.tagName=='TEXTAREA')w.classList.add('ta')});
 document.addEventListener('pointerdown',e=>{const t=e.target;if(t&&t.tagName=='SELECT'){const a=document.activeElement;if(a&&a!==t&&/INPUT|TEXTAREA/.test(a.tagName))a.blur()}},true);
 document.addEventListener('scroll',()=>{tah.hidden=true},true);
 let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(scan,60)}).observe(document.body,{childList:true,subtree:true});scan();
 document.addEventListener('click',e=>{const i=e.target;if(i&&i.matches&&i.matches('input[type=date],input[type=datetime-local],input[type=time]')&&i.showPicker){try{i.showPicker()}catch(_){}}});
})();
